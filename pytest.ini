[pytest]
# Módulos ficam na raiz (config.py, agent.py, ...); expõe-os ao import dos testes.
pythonpath = .
# Funções `async def test_*` rodam sem precisar de decorator em cada uma.
asyncio_mode = auto
testpaths = tests
# `sem_dono`: o teste EXERCITA a ausência de dono e por isso escapa do fixture
# `_dono_do_turno` (conftest). Registrado aqui para o pytest não avisar de marcador
# desconhecido — e, mais importante, para que a lista de quem escapa da identidade
# padrão seja procurável num `grep` só.
markers =
    sem_dono: roda SEM dono marcado (testa DonoIndefinido / fallback de admin)
