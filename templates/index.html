<!DOCTYPE html>
<html lang="pt-BR" data-tema="escuro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="color-scheme" content="dark light">
    <title>Mente Digital</title>
    <!-- A MESMA marca da barra de tarefas e da bandeja, servida do .ico gerado
         em dados/marca/ (main.py -> /favicon.ico). Sem isto o navegador pede
         /favicon.ico assim mesmo e leva 404 em todo carregamento. -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <!-- 100% local DE VERDADE (painel 2026-07-24): fontes do SISTEMA + ícones SVG
         inline. O fonts.googleapis.com contradizia o pitch "sem telemetria de
         terceiros" (o Google via cada abertura da UI) e, offline na LAN, os
         ícones-ligadura viravam texto cru ("menu", "bedtime") em todos os botões.

         ESTE ARQUIVO SERVE TRÊS CASCAS: aba de navegador, janela nativa sem
         moldura (app.py / WebView2) e container. A única diferença é a barra de
         título — desenhada só quando `window.pywebview` existe. Nada de segunda
         interface para manter em sincronia; é também a base do port Android. -->
    <style>
        /* ================================================================= *
         *  PALETA — o único lugar a mexer para re-skinar.
         *  O acento é o gradiente do próprio app (azul → roxo → rosa), o
         *  mesmo da tela de boot em app.py, para a casca combinar com as
         *  transições de tela. Para a leitura literal do ExitLag, troque os
         *  três --acc do bloco escuro por #F0323C / #E8353E / #8E1219.
         * ================================================================= */
        :root {
            --acc1: #4285F4; --acc2: #9B72CB; --acc3: #D96570;
            --grad: linear-gradient(100deg, var(--acc1) 0%, var(--acc2) 52%, var(--acc3) 100%);
            --font: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
            --safe-b: env(safe-area-inset-bottom, 0px);
            --safe-t: env(safe-area-inset-top, 0px);
            --barra-h: 0px;                 /* vira 42px quando há barra própria */
            --curva: cubic-bezier(.22, 1, .36, 1);
        }
        :root[data-tema="escuro"] {
            --bg: #0B0B0D; --sup: #16161A; --sup2: #202126; --sup3: #2A2C32;
            --txt: #F2F2F3; --txt2: #8B8F96; --linha: rgba(255,255,255,.08);
            --acc: #8AB4F8; --acc-fraco: rgba(138,180,248,.14);
            --bolha: #23252B; --sombra: 0 10px 34px rgba(0,0,0,.55);
            --brilho1: rgba(155,114,203,.16); --brilho2: rgba(217,101,112,.11);
        }
        :root[data-tema="claro"] {
            --bg: #FFFFFF; --sup: #F4F5F7; --sup2: #ECEEF1; --sup3: #E1E4E9;
            --txt: #1A1B1E; --txt2: #5F646B; --linha: rgba(0,0,0,.10);
            --acc: #1A73E8; --acc-fraco: rgba(26,115,232,.10);
            --bolha: #EDF1F7; --sombra: 0 10px 30px rgba(0,0,0,.14);
            --brilho1: rgba(155,114,203,.10); --brilho2: rgba(217,101,112,.07);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body {
            background: var(--bg); color: var(--txt); overflow: hidden;
            display: flex; flex-direction: column; height: 100dvh;
            /* O brilho difuso subindo do rodapé — a assinatura da casca, herdada
               da tela de boot para a janela não "trocar de identidade" ao abrir. */
            background-image:
                radial-gradient(125% 62% at 50% 122%, var(--brilho1) 0%, transparent 60%),
                radial-gradient(85% 50% at 8% 108%, var(--brilho2) 0%, transparent 58%);
            background-attachment: fixed;
        }
        button, input, textarea { font-family: var(--font); color: inherit; }
        .ico { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: var(--sup3); border-radius: 99px; }
        ::-webkit-scrollbar-track { background: transparent; }

        /* ================= barra de título (só na janela nativa) ============ */
        /* Idêntica à da tela de boot em app.py: mesma altura, mesmo wordmark na
           mesma posição — assim a troca splash→app não pisca nem "pula". */
        #janela-barra { display: none; }
        html.nativo { --barra-h: 42px; }
        html.nativo #janela-barra {
            display: flex; align-items: center; height: 42px; flex-shrink: 0;
            border-bottom: 1px solid var(--linha); position: relative; z-index: 4000;
            background: var(--bg);
        }
        #janela-arrasto { flex: 1; height: 100%; }
        #janela-marca {
            position: absolute; left: 50%; transform: translateX(-50%);
            font-size: .78rem; font-weight: 600; letter-spacing: .22em;
            pointer-events: none; user-select: none; white-space: nowrap;
        }
        #janela-marca b {
            font-weight: 600; background: var(--grad);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }
        .janela-btn {
            width: 46px; height: 42px; border: 0; background: none; color: var(--txt2);
            cursor: pointer; display: flex; align-items: center; justify-content: center; transition: .15s;
        }
        .janela-btn:hover { background: color-mix(in srgb, var(--txt) 12%, transparent); color: var(--txt); }
        .janela-btn.sair:hover { background: #E81123; color: #fff; }

        /* ========================= sidebar ================================= */
        /* `top: var(--barra-h)`: na janela nativa os primeiros 42px são a barra de
           título própria. Com top:0 a lateral passava POR BAIXO dela e o cabeçalho
           "Conversas" ficava cortado. No navegador a variável é 0 e nada muda. */
        #sidebar {
            position: fixed; top: var(--barra-h); left: 0; bottom: 0; width: min(320px, 86vw);
            background: var(--sup); border-right: 1px solid var(--linha);
            transform: translateX(-101%); transition: transform .3s var(--curva);
            z-index: 3000; display: flex; flex-direction: column; padding-top: var(--safe-t);
        }
        #sidebar.open { transform: translateX(0); box-shadow: var(--sombra); }
        .sidebar-header { padding: 18px 16px 6px; display: flex; justify-content: space-between; align-items: center; }
        .sidebar-header span { font-size: 1.05rem; font-weight: 600; }
        .sidebar-scroll { flex: 1; overflow-y: auto; padding: 8px 10px calc(16px + var(--safe-b)); display: flex; flex-direction: column; gap: 3px; }
        #btn-novo-chat {
            display: flex; align-items: center; gap: 10px; margin: 6px 12px 10px; padding: 12px 16px;
            background: var(--sup2); border: 1px solid var(--linha); border-radius: 24px; cursor: pointer;
            font-size: .93rem; font-weight: 500; transition: .18s;
        }
        #btn-novo-chat:hover { background: var(--sup3); }
        .hist-label { font-size: .7rem; color: var(--txt2); padding: 8px 14px 4px; letter-spacing: .06em; text-transform: uppercase; }
        /* `flex-shrink: 0` NÃO é detalhe: a lista é um flex-column de altura fixa, e
           item de flex ENCOLHE por padrão. Com 30 conversas dentro, o navegador
           comprimia todas até os títulos se sobreporem — invisível enquanto o título
           era de uma linha só, escancarado quando virou duas (2026-08-02). */
        .history-item { padding: 11px 14px; border-radius: 12px; cursor: pointer;
                        transition: background .15s; overflow: hidden; flex-shrink: 0; }
        .history-item:hover { background: var(--sup2); }
        .history-item.active { background: var(--acc-fraco); }
        /* Título de conversa em DUAS linhas, não uma. Em uma linha o titulo vinha
           do primeiro turno e era cortado quase sempre -- "Como faco para..." nao
           distingue conversa nenhuma. Duas linhas cabem o suficiente para escolher,
           e o clamp mantem a lista alinhada. */
        .hi-title { font-size: .89rem; line-height: 1.35; display: -webkit-box;
                    -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
                    overflow-wrap: anywhere; }
        .hi-meta { font-size: .71rem; color: var(--txt2); margin-top: 2px; }
        .history-empty { color: var(--txt2); font-size: .85rem; text-align: center; padding: 34px 16px; line-height: 1.6; }

        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 2900; opacity: 0; pointer-events: none; transition: opacity .3s; }
        #overlay.show { opacity: 1; pointer-events: all; }

        /* ========================= app bar ================================ */
        header {
            padding: 8px 8px; display: flex; align-items: center; gap: 4px; z-index: 20;
            flex-shrink: 0; padding-top: calc(8px + var(--safe-t));
        }
        html.nativo header { padding-top: 8px; }
        .icon-btn {
            background: none; border: none; cursor: pointer; display: flex; align-items: center;
            justify-content: center; width: 42px; height: 42px; border-radius: 50%;
            transition: background .18s, color .18s; flex-shrink: 0; color: var(--txt);
        }
        .icon-btn:hover { background: var(--sup2); }
        .brand { flex: 1; display: flex; align-items: center; gap: 9px; font-size: 1.1rem; font-weight: 600; min-width: 0; }
        .brand .rotulo { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #conn-dot { width: 8px; height: 8px; border-radius: 50%; background: #F28B82; transition: background .3s; box-shadow: 0 0 8px currentColor; flex-shrink: 0; }
        #conn-dot.online { background: #62C77B; }
        #idle-badge {
            display: none; align-items: center; gap: 5px; font-size: .7rem; font-weight: 500;
            color: var(--acc); background: var(--acc-fraco); border: 1px solid var(--acc-fraco);
            padding: 5px 10px; border-radius: 20px; white-space: nowrap;
        }
        body.idle #idle-badge { display: inline-flex; animation: idle-pulse 2.2s ease-in-out infinite; }
        @keyframes idle-pulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
        body.idle #btn-end { color: var(--acc); border-color: var(--acc); background: var(--acc-fraco); }

        /* ===================== faixa de controle ========================== */
        /* Os três interruptores do sistema, sempre visíveis. Ficam FORA do
           cabeçalho de propósito: lá disputariam espaço com a navegação e, num
           app que fica aberto o dia inteiro, o ESTADO (ligado? consolidando?)
           importa tanto quanto os comandos. */
        #strip { display: flex; gap: 7px; padding: 0 12px 8px; flex-shrink: 0; overflow-x: auto; scrollbar-width: none; }
        #strip::-webkit-scrollbar { display: none; }
        .sw {
            display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: 20px;
            background: var(--sup); border: 1px solid var(--linha); color: var(--txt2); cursor: pointer;
            font-size: .76rem; font-weight: 500; white-space: nowrap; transition: .18s var(--curva);
        }
        .sw:hover { background: var(--sup2); color: var(--txt); border-color: var(--acc); }
        .sw:disabled { opacity: .5; cursor: progress; }
        .sw .led { width: 7px; height: 7px; border-radius: 50%; background: var(--txt2); flex-shrink: 0; transition: .3s; }
        .sw.on { color: var(--txt); border-color: color-mix(in srgb, var(--acc) 45%, transparent); }
        .sw.on .led { background: #62C77B; box-shadow: 0 0 8px #62C77B; }
        .sw.off .led { background: #8B8F96; box-shadow: none; }
        .sw.ocupado .led { background: var(--acc); animation: pisca 1.2s ease-in-out infinite; }
        .sw .medida { color: var(--txt2); font-variant-numeric: tabular-nums; font-size: .72rem; }
        /* Crachá de não-lidas do mensageiro. Mora no interruptor porque a faixa é o
           único lugar SEMPRE visível: recado esperando dentro de um painel fechado é
           indistinguível de recado nenhum. `[hidden]` precisa da regra explícita — o
           `display` do seletor acima vence o `hidden` do HTML, e o crachá ficaria
           aceso com zero recado. */
        .sw .cracha {
            min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px;
            background: var(--acc3); color: #fff; font-size: .66rem; font-weight: 600;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .sw .cracha[hidden] { display: none; }

        /* ====================== modo avançado ============================= */
        #avancado {
            position: fixed; inset: var(--barra-h) 0 0 0; z-index: 2500; background: var(--bg);
            display: flex; flex-direction: column; opacity: 0; pointer-events: none;
            transform: translateY(14px); transition: .3s var(--curva);
        }
        #avancado.active { opacity: 1; pointer-events: auto; transform: translateY(0); }
        .av-top { display: flex; align-items: center; gap: 6px; padding: 10px 10px 6px; flex-shrink: 0; }
        .av-tabs { display: flex; gap: 4px; flex: 1; background: var(--sup); padding: 4px; border-radius: 16px; }
        /* `min-width: 0` desde que a 5ª aba (Recados) entrou: item de flex não encolhe
           abaixo do min-content por padrão, e na janela nativa (430 px) os cinco
           rótulos estouravam a barra em vez de repartir o espaço. */
        .av-tab {
            flex: 1; min-width: 0; border: none; background: none; color: var(--txt2); padding: 9px 6px;
            border-radius: 12px; cursor: pointer; font-size: .82rem; font-weight: 500; transition: .18s;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .av-tab:hover { color: var(--txt); }
        .av-tab.on { background: var(--sup2); color: var(--txt); box-shadow: var(--sombra); }
        .av-corpo { flex: 1; overflow-y: auto; padding: 6px 14px calc(20px + var(--safe-b)); }
        .av-secao { display: none; flex-direction: column; gap: 10px; }
        .av-secao.on { display: flex; animation: subir .3s var(--curva); }
        .av-vazio { color: var(--txt2); font-size: .86rem; text-align: center; padding: 40px 20px; line-height: 1.6; }
        #av-busca {
            width: 100%; background: var(--sup); border: 1px solid var(--linha); border-radius: 18px;
            padding: 12px 16px; font-size: 15px; outline: none; transition: .2s;
        }
        #av-busca:focus { border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-fraco); }
        /* Filtros do vault. `flex-wrap` porque a janela nativa nasce com 430 px
           de largura: sem ele os três seletores estouram a lateral. */
        #av-filtros { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
        #av-filtros select, #av-filtros button {
            background: var(--sup); color: var(--txt); border: 1px solid var(--linha);
            border-radius: 14px; padding: 7px 11px; font-size: 12.5px; font-family: inherit;
            outline: none; cursor: pointer; transition: .18s; max-width: 100%;
        }
        #av-filtros select:hover, #av-filtros button:hover { border-color: var(--acc); }
        #av-filtros select:focus { border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-fraco); }
        #av-filtros button { color: var(--txt2); }
        .av-item {
            background: var(--sup); border: 1px solid var(--linha); border-radius: 16px; padding: 12px 14px;
            cursor: pointer; transition: .18s var(--curva);
        }
        .av-item:hover { background: var(--sup2); border-color: var(--acc); transform: translateY(-1px); }
        .av-item .t { font-size: .88rem; font-weight: 500; overflow-wrap: anywhere; }
        .av-item .s { font-size: .77rem; color: var(--txt2); margin-top: 4px; line-height: 1.45; overflow-wrap: anywhere; }
        .av-tag {
            display: inline-block; font-size: .68rem; padding: 2px 8px; border-radius: 10px;
            background: var(--acc-fraco); color: var(--acc); margin-right: 6px; vertical-align: 1px;
        }
        .av-linha { display: flex; justify-content: space-between; gap: 12px; padding: 9px 2px; border-bottom: 1px solid var(--linha); font-size: .84rem; }
        .av-linha span:last-child { color: var(--txt2); font-variant-numeric: tabular-nums; text-align: right; }
        .av-titulo { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--txt2); margin: 14px 0 2px; }
        /* ---- aba Recados: o canal com o mestre ---- */
        /* Reusa `.av-item` (mesma linguagem do vault e das fontes) e só desfaz o que
           não vale aqui: item de recado não abre nada, então não pode se comportar
           como link ao passar o ponteiro. */
        /* A lista precisa do gap PRÓPRIO (medido: 0 px entre os itens sem ele). No
           vault os itens colados passam por linhas de uma tabela; aqui cada um é um
           cartão com moldura, e dois colados leem como um recado só. */
        #rec-lista { display: flex; flex-direction: column; gap: 8px; }
        .rec-item { cursor: default; }
        .rec-item:hover { background: var(--sup); border-color: var(--linha); transform: none; }
        /* `.av-item .t` é bloco; aqui vira flex porque a hora se alinha à direita por
           `margin-left:auto` — sem isto ela cola no nome. */
        .rec-item .t { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
        .rec-item.nova { border-color: color-mix(in srgb, var(--acc) 50%, transparent); background: var(--acc-fraco); }
        .rec-item.minha { opacity: .72; }          /* o que EU mandei fica em segundo plano */
        #rec-form { display: flex; flex-direction: column; gap: 9px; }
        #rec-tipos { display: flex; gap: 6px; flex-wrap: wrap; }
        #rec-form textarea, .rec-resposta textarea {
            width: 100%; min-height: 80px; resize: vertical; background: var(--sup);
            border: 1px solid var(--linha); border-radius: 14px; padding: 11px 14px;
            font-size: 14.5px; line-height: 1.5; outline: none; transition: .2s;
        }
        #rec-form textarea:focus, .rec-resposta textarea:focus { border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-fraco); }
        #rec-form .linha { display: flex; align-items: center; gap: 8px; }
        #rec-form .conta { color: var(--txt2); font-size: .72rem; margin-left: auto; font-variant-numeric: tabular-nums; }
        .rec-resposta { display: flex; flex-direction: column; gap: 7px; margin-top: 10px; }
        .rec-resposta textarea { min-height: 62px; }
        /* Leitor de nota — empilha SOBRE o painel, com voltar próprio. */
        #av-leitor {
            position: absolute; inset: 0; background: var(--bg); display: none; flex-direction: column;
            animation: entra-lado .28s var(--curva);
        }
        #av-leitor.on { display: flex; }
        @keyframes entra-lado { from { opacity: 0; transform: translateX(22px); } }
        .av-leitor-top { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--linha); flex-shrink: 0; }
        .av-leitor-top .nome { flex: 1; font-size: .9rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #av-leitor-corpo { flex: 1; overflow-y: auto; padding: 16px 16px calc(24px + var(--safe-b)); font-size: .93rem; line-height: 1.65; }
        /* Grafo da vizinhança. SVG inline desenhado à mão: as duas páginas do
           graphify puxam o vis-network do unpkg.com, e servir CDN quebraria o
           pilar "100% local" — offline elas nem renderizam. Para 1-2 saltos são
           dezenas de nós, e um layout radial não precisa de biblioteca. */
        #av-grafo { flex: 1; overflow: auto; display: flex; flex-direction: column;
                    padding: 8px 8px calc(16px + var(--safe-b)); }
        /* ⚠ ESTA LINHA NÃO É REDUNDANTE. O atributo `hidden` só esconde porque a
           folha do navegador traz `[hidden]{display:none}` — e QUALQUER regra de
           autor com `display` vence, por especificidade. Sem isto o grafo ficava
           permanentemente visível empilhado sob o texto da nota, e o botão parecia
           não fazer nada. Medido no navegador em 2026-08-02: `hidden: true` com
           `getComputedStyle().display === 'flex'`. */
        #av-grafo[hidden] { display: none; }
        #av-grafo svg { width: 100%; height: auto; flex: 1; min-height: 0; }
        #av-grafo .aresta { stroke: var(--acc); fill: none; }
        #av-grafo .no { cursor: pointer; }
        #av-grafo .no circle { stroke: var(--bg); stroke-width: 2; transition: .15s; }
        #av-grafo .no:hover circle { stroke: var(--txt); }
        #av-grafo .no text { fill: var(--txt2); font-size: 7px; pointer-events: none;
                             text-anchor: middle; }
        #av-grafo .no.semente text { fill: var(--txt); font-weight: 600; font-size: 8px; }
        #av-grafo .legenda { font-size: .72rem; color: var(--txt2); text-align: center;
                             padding: 6px 4px 2px; flex-shrink: 0; }
        #av-btn-grafo.on { background: var(--acc-fraco); color: var(--acc); }

        /* ========================= boas-vindas ============================ */
        #welcome-screen {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 0 24px calc(150px + var(--safe-b)); gap: 8px;
            animation: subir .5s var(--curva);
        }
        @keyframes subir { from { opacity: 0; transform: translateY(14px); } }
        .welcome-text {
            font-size: clamp(1.9rem, 8vw, 2.7rem); font-weight: 600; letter-spacing: -.02em;
            background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }
        .welcome-sub { color: var(--txt2); font-size: .95rem; }
        #chips { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; margin-top: 26px; width: 100%; max-width: 440px; }
        .chip {
            background: var(--sup); border: 1px solid var(--linha); border-radius: 16px; padding: 13px 14px;
            text-align: left; font-size: .82rem; line-height: 1.4; color: var(--txt); cursor: pointer;
            transition: transform .18s var(--curva), background .18s, border-color .18s;
        }
        .chip:hover { background: var(--sup2); border-color: var(--acc); transform: translateY(-2px); }
        .chip .chip-ico { display: block; color: var(--acc); margin-bottom: 7px; }

        /* ========================= chat =================================== */
        #chat-container {
            flex: 1; overflow-y: auto; display: none; flex-direction: column; gap: 16px;
            scroll-behavior: smooth; width: 100%; max-width: 840px; margin: 0 auto;
            padding: 8px 16px calc(160px + var(--safe-b)); overscroll-behavior: contain;
        }
        .msg-row { display: flex; width: 100%; animation: bolha-entra .34s var(--curva); }
        @keyframes bolha-entra { from { opacity: 0; transform: translateY(10px); } }
        .msg-row.user { justify-content: flex-end; }
        .msg-row.ia { flex-direction: column; align-items: flex-start; gap: 4px; }
        .bubble { max-width: 86%; font-size: 1rem; line-height: 1.62; overflow-wrap: anywhere; }
        .bubble.user { background: var(--bolha); padding: 11px 16px; border-radius: 20px 20px 6px 20px; }
        .bubble.ia { background: transparent; padding: 0; max-width: 100%; }
        .bubble h2, .bubble h3, .bubble h4 { margin: 10px 0 4px; line-height: 1.3; }
        .bubble h2 { font-size: 1.18rem; } .bubble h3 { font-size: 1.06rem; } .bubble h4 { font-size: 1rem; }
        .bubble code { background: var(--sup2); padding: 1px 6px; border-radius: 5px; font-family: 'Cascadia Mono','Consolas',monospace; font-size: .88em; }
        .bubble pre.code { background: var(--sup); border: 1px solid var(--linha); padding: 12px 14px; border-radius: 12px; overflow-x: auto; margin: 9px 0; }
        .bubble pre.code code { background: none; padding: 0; display: block; white-space: pre; }
        .bubble a { color: var(--acc); }
        /* Figuras dos livros (Fase 5b): o vault guarda WebP e o átomo traz o
           wikilink; aqui elas aparecem na resposta sem estourar a bolha. */
        .bubble img.fig { max-width: 100%; height: auto; border-radius: 12px; margin: 9px 0; display: block; background: var(--sup2); border: 1px solid var(--linha); }
        /* Ações da resposta — o "copiar" que faltava. Discretas até o ponteiro chegar. */
        .acoes { display: flex; gap: 2px; opacity: .38; transition: opacity .2s; }
        .msg-row.ia:hover .acoes, .acoes:focus-within { opacity: 1; }
        .acao-btn { background: none; border: none; cursor: pointer; color: var(--txt2); width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; transition: .16s; }
        .acao-btn:hover { background: var(--sup2); color: var(--txt); }
        /* Pensando: os três pontos até o 1º token chegar. */
        #pensando { display: none; gap: 5px; padding: 6px 2px; }
        #pensando.on { display: flex; }
        #pensando i { width: 7px; height: 7px; border-radius: 50%; background: var(--acc); animation: pisca 1.25s ease-in-out infinite; }
        #pensando i:nth-child(2) { animation-delay: .18s; } #pensando i:nth-child(3) { animation-delay: .36s; }
        @keyframes pisca { 0%,80%,100% { opacity: .25; transform: scale(.75); } 40% { opacity: 1; transform: scale(1); } }

        /* ============ recado: mensagem de OUTRA PESSOA no meio do chat ==========
           Ela NÃO pode parecer o assistente falando, e isso não é gosto: a bolha da
           IA é transparente, sem moldura e sem autor — um pedido escrito por outra
           pessoa renderizado ali vira instrução com a autoridade do assistente. Daí
           o cartão com moldura, o nome de quem escreveu no cabeçalho e uma linha que
           diz, em palavras, que aquilo não é a Mente Digital. */
        .msg-row.recado { justify-content: flex-start; }
        .recado {
            max-width: 86%; background: var(--sup); border: 1px solid var(--linha);
            border-left: 3px solid var(--acc2); border-radius: 6px 16px 16px 6px;
            padding: 11px 15px; font-size: .95rem; line-height: 1.55;
        }
        .rec-top { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 5px; }
        .rec-top .ico { width: 16px; height: 16px; color: var(--acc2); }
        .rec-de { font-weight: 600; overflow-wrap: anywhere; }
        .rec-hora { color: var(--txt2); font-size: .72rem; margin-left: auto; font-variant-numeric: tabular-nums; }
        /* `pre-wrap` e não markdown: ver o comentário de `mostrarRecado()`. O texto de
           outra pessoa entra por textContent, então a quebra de linha só sobrevive
           aqui — e é a ÚNICA formatação que ele ganha. */
        .rec-corpo { white-space: pre-wrap; overflow-wrap: anywhere; }
        .rec-nota { color: var(--txt2); font-size: .7rem; margin-top: 8px; }
        .rec-acoes { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 9px; }
        .rec-btn {
            background: var(--sup2); border: 1px solid var(--linha); color: var(--txt2);
            border-radius: 14px; padding: 5px 11px; font-size: .74rem; cursor: pointer; transition: .16s;
        }
        .rec-btn:hover { border-color: var(--acc); color: var(--txt); }
        .rec-btn:disabled { opacity: .5; cursor: progress; }
        .rec-btn.forte { background: var(--acc-fraco); color: var(--acc); border-color: transparent; }
        .rec-btn.on { background: var(--acc-fraco); color: var(--acc); border-color: color-mix(in srgb, var(--acc) 45%, transparent); }

        #btn-descer {
            position: fixed; left: 50%; transform: translateX(-50%) scale(.6); bottom: calc(104px + var(--safe-b));
            width: 38px; height: 38px; border-radius: 50%; background: var(--sup2); border: 1px solid var(--linha);
            color: var(--txt); cursor: pointer; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: .24s var(--curva); z-index: 45; box-shadow: var(--sombra);
        }
        #btn-descer.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) scale(1); }

        #toast {
            position: fixed; top: calc(var(--barra-h) + 56px); left: 50%; transform: translateX(-50%) translateY(-8px);
            background: var(--sup2); padding: 10px 18px; border-radius: 22px; border: 1px solid var(--linha);
            box-shadow: var(--sombra); font-size: .84rem; opacity: 0; pointer-events: none;
            transition: .28s var(--curva); z-index: 5000; max-width: 90vw; text-align: center;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* Recusa de acesso: barra PERSISTENTE, não toast. O toast some em 3,5 s e o
           usuário barrado precisa de duas coisas que só ficam de pé — o motivo (que
           ele não vai reler) e um botão para tentar de novo depois de arrumar o
           token. O ponto vermelho sozinho dizia "sem conexão", que é a mentira que
           esta barra existe para desfazer. */
        #barra-acesso {
            display: none; align-items: center; gap: 10px; margin: 0 12px 8px; padding: 9px 13px;
            border-radius: 12px; font-size: .8rem; line-height: 1.35;
            background: rgba(242, 139, 130, .13); border: 1px solid rgba(242, 139, 130, .45);
            color: var(--txt);
        }
        #barra-acesso.show { display: flex; }
        #barra-acesso span { flex: 1; min-width: 0; }
        #barra-acesso button { flex-shrink: 0; }


        /* ===== aba Consumo: os dois gráficos do wattímetro ===== */
        .cs-topo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        .cs-total { font-size: 1.35rem; font-weight: 600; }
        .cs-sub { font-size: .74rem; color: var(--txt2); }
        .cs-tarifa { width: 74px; background: var(--sup); border: 1px solid var(--linha);
                     color: var(--txt); border-radius: 8px; padding: 4px 7px; font-size: .76rem; }
        .cs-legenda { display: flex; gap: 12px; flex-wrap: wrap; font-size: .7rem; color: var(--txt2); margin: 6px 0 2px; }
        .cs-legenda i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
        .cs-graf { width: 100%; overflow-x: auto; }
        .cs-graf svg { display: block; }
        .cs-nota { font-size: .7rem; color: var(--txt2); line-height: 1.5; margin-top: 8px;
                   border-left: 2px solid var(--linha); padding-left: 9px; }

        /* ========================= composer =============================== */
        #bottom-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; display: flex; align-items: flex-end;
            justify-content: center; gap: 10px; padding: 10px 12px calc(14px + var(--safe-b));
            background: linear-gradient(to top, var(--bg) 58%, transparent); z-index: 50;
        }
        #composer { flex: 1; max-width: 800px; display: flex; align-items: flex-end; gap: 8px; }
        #input-wrapper {
            flex: 1; background: var(--sup); border: 1px solid var(--linha); border-radius: 26px;
            display: flex; align-items: flex-end; padding: 5px 6px; transition: border-color .2s, box-shadow .2s; min-height: 52px;
        }
        #input-wrapper:focus-within { border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-fraco); }
        #texto-input {
            flex: 1; background: transparent; border: none; font-size: 16px; padding: 11px 6px;
            outline: none; min-width: 0; resize: none; line-height: 1.4; max-height: 132px; overflow-y: auto;
        }
        #texto-input::placeholder { color: var(--txt2); }
        .pill-btn { background: none; border: none; color: var(--txt2); cursor: pointer; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: .18s; }
        .pill-btn:hover { background: var(--sup2); color: var(--txt); }
        #btn-send-text { color: var(--acc); }
        #btn-mic {
            width: 52px; height: 52px; border-radius: 50%; border: none; cursor: pointer; display: flex;
            align-items: center; justify-content: center; color: #fff; background: var(--grad);
            box-shadow: 0 5px 18px color-mix(in srgb, var(--acc2) 42%, transparent); flex-shrink: 0;
            transition: transform .2s var(--curva);
        }
        #btn-mic:hover { transform: scale(1.06); }
        #btn-mic:active { transform: scale(.95); }

        /* ========================= live overlay =========================== */
        #live-overlay {
            position: fixed; inset: 0; z-index: 2000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; opacity: 0; pointer-events: none;
            transform: scale(1.06); transition: opacity .38s var(--curva), transform .38s var(--curva);
            background:
                radial-gradient(115% 70% at 50% 118%, var(--brilho1) 0%, transparent 62%),
                radial-gradient(120% 85% at 50% 12%, color-mix(in srgb, var(--acc1) 14%, transparent) 0%, transparent 58%),
                var(--bg);
            padding-top: var(--barra-h);
        }
        #live-overlay.active { opacity: 1; pointer-events: auto; transform: scale(1); }
        .live-top { position: absolute; top: calc(var(--barra-h) + 16px); left: 0; right: 0; display: flex; justify-content: center; }
        .live-chip { font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--txt2); background: var(--sup); border: 1px solid var(--linha); padding: 6px 15px; border-radius: 20px; }
        .live-stage { display: flex; flex-direction: column; align-items: center; }
        .orb-wrap { position: relative; width: 230px; height: 230px; display: flex; align-items: center; justify-content: center; }
        /* --nivel (0..1) é o RMS REAL do seu microfone, escrito pelo onaudioprocess:
           enquanto ouve, o orbe respira com a SUA voz em vez de uma animação fixa. */
        .orb {
            --nivel: 0; position: relative; width: 152px; height: 152px; border-radius: 50%;
            background: radial-gradient(circle at 32% 28%, #C7DAFF 0%, var(--acc1) 34%, var(--acc2) 72%, var(--acc3) 100%);
            box-shadow: 0 0 72px 12px color-mix(in srgb, var(--acc1) 34%, transparent);
            transition: background .5s ease, box-shadow .5s ease; will-change: transform;
        }
        .orb::after { content: ''; position: absolute; inset: -28px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--acc2) 30%, transparent), transparent 68%); filter: blur(15px); z-index: -1; }
        .ring { position: absolute; border-radius: 50%; border: 1.5px solid color-mix(in srgb, var(--acc) 42%, transparent); inset: 0; opacity: 0; }
        .orb.listening { transform: scale(calc(1 + var(--nivel) * .3)); transition: transform .09s linear; animation: orb-breathe 3.4s ease-in-out infinite; }
        .orb.listening ~ .ring { animation: ring-out 3s ease-out infinite; }
        .orb.listening ~ .ring.r2 { animation-delay: 1.5s; }
        .orb.thinking { animation: orb-think 1.5s linear infinite; border-radius: 42% 58% 55% 45%; }
        .orb.speaking {
            background: radial-gradient(circle at 32% 28%, #FBD3C6 0%, #F5A98F 34%, var(--acc3) 70%, var(--acc2) 100%);
            box-shadow: 0 0 92px 16px color-mix(in srgb, var(--acc3) 40%, transparent);
            animation: orb-speak .52s ease-in-out infinite alternate;
        }
        .orb.dormindo { background: radial-gradient(circle at 32% 28%, #6B7078 0%, #41464D 55%, #2A2E34 100%); box-shadow: none; opacity: .6; }
        @keyframes orb-breathe { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.14); } }
        @keyframes orb-think { 0% { transform: rotate(0) scale(1.02); } 50% { transform: rotate(180deg) scale(1.1); } 100% { transform: rotate(360deg) scale(1.02); } }
        @keyframes orb-speak { 0% { transform: scale(1.04); } 100% { transform: scale(1.2); } }
        @keyframes ring-out { 0% { transform: scale(.7); opacity: .5; } 100% { transform: scale(1.9); opacity: 0; } }
        .live-status-text { margin-top: 38px; font-size: 1.22rem; text-align: center; padding: 0 24px; font-weight: 500; }
        #live-legenda { margin-top: 12px; font-size: .84rem; color: var(--txt2); text-align: center; padding: 0 32px; max-width: 460px; min-height: 2.4em; line-height: 1.4; }
        .live-controls { position: absolute; bottom: calc(40px + var(--safe-b)); display: flex; align-items: center; gap: 20px; }
        .live-ctrl {
            width: 58px; height: 58px; border-radius: 50%; border: 1px solid var(--linha); cursor: pointer;
            display: flex; align-items: center; justify-content: center; background: var(--sup2); color: var(--txt);
            transition: .2s var(--curva);
        }
        .live-ctrl:hover { background: var(--sup3); transform: scale(1.06); }
        .live-ctrl.end { background: #E8453C; border-color: #E8453C; color: #fff; }
        .live-ctrl.mudo-on { background: var(--acc); border-color: var(--acc); color: #fff; }

        @media (max-width: 480px) {
            #idle-badge .idle-label { display: none; }
            #idle-badge { padding: 5px 7px; }
            .brand { font-size: 1rem; }
            #chips { grid-template-columns: 1fr; }
        }
        @media (min-width: 760px) { header { padding: 12px 16px; } html.nativo header { padding-top: 12px; } }
        @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
</head>
<body>
    <!-- Barra de título da janela nativa. `display:none` por padrão: só aparece
         com a classe `nativo` no <html>, posta quando window.pywebview existe. -->
    <div id="janela-barra">
        <div id="janela-arrasto" class="pywebview-drag-region"></div>
        <div id="janela-marca">MENTE<b>DIGITAL</b></div>
        <button class="janela-btn" onclick="janelaApi('minimizar')" title="Minimizar" aria-label="Minimizar">
            <svg width="11" height="11" viewBox="0 0 12 12"><path d="M1 6h10" stroke="currentColor" stroke-width="1.2"/></svg></button>
        <button class="janela-btn" onclick="janelaApi('alternar_maximizar')" title="Maximizar" aria-label="Maximizar">
            <svg width="11" height="11" viewBox="0 0 12 12"><rect x="1.6" y="1.6" width="8.8" height="8.8" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
        <button class="janela-btn sair" onclick="janelaApi('fechar')" title="Fechar" aria-label="Fechar">
            <svg width="11" height="11" viewBox="0 0 12 12"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" stroke="currentColor" stroke-width="1.2"/></svg></button>
    </div>

    <div id="overlay" onclick="fecharSidebar()"></div>

    <nav id="sidebar">
        <div class="sidebar-header">
            <span>Conversas</span>
            <button class="icon-btn" onclick="fecharSidebar()" title="Fechar"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
        <button id="btn-novo-chat" onclick="novoChat()"><svg class="ico" style="width:20px;height:20px" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> Novo chat</button>
        <div class="hist-label">Recentes</div>
        <div class="sidebar-scroll" id="history-container"></div>
    </nav>

    <header>
        <button class="icon-btn" onclick="abrirSidebar()" title="Conversas"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <div class="brand"><span id="conn-dot" title="Conexão"></span> <span class="rotulo">Mente Digital</span></div>
        <div id="idle-badge"><svg class="ico" style="width:15px;height:15px" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 14.2A8.5 8.5 0 0 1 9.8 3.6a8.5 8.5 0 1 0 10.6 10.6z"/></svg><span class="idle-label">Consolidando…</span></div>
        <button class="icon-btn" id="btn-tema" onclick="alternarTema()" title="Tema claro/escuro"><svg class="ico" id="ico-tema" viewBox="0 0 24 24" aria-hidden="true"></svg></button>
        <button class="icon-btn" onclick="novoChat()" title="Novo chat"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-6"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L13 14l-4 1 1-4 8.5-8.5z"/></svg></button>
    </header>

    <div id="strip">
        <button class="sw on" id="sw-energia" onclick="alternarEnergia()" title="Solta os modelos da VRAM sem fechar o app">
            <!-- ⚠ Tooltip PRÓPRIO no span da medida, e não no botão: sem ele o dono lê
                 "96 W" logo depois de "VRAM" e conclui que o assistente gasta 96 W parado.
                 É falso. Os watts são do DISPOSITIVO — 22 programas tinham contexto na GPU
                 quando isto foi medido (compositor do Windows, navegador, música) —, a
                 mesma ressalva que energia.py já documenta para a VRAM. -->
            <span class="led"></span><span id="sw-energia-txt">Ligado</span><span class="medida" id="sw-energia-med" title="Watt TOTAL = GPU + CPU, e do DISPOSITIVO inteiro, não do assistente: a GPU soma tudo que tem contexto nela (desktop, navegador, jogos) e a CPU é o pacote inteiro. Se aparecer só 'W GPU', a parcela da CPU está faltando (o ajudante elevado não está de pé) — o total nunca é somado pela metade. O número após a barra é o teto do driver, que é da GPU. O til (~) marca leitura instantânea; sem til é a média dos últimos ~20 s."></span>
        </button>
        <button class="sw" id="btn-end" onclick="encerrarConversa()" title="Consolidar agora: encerra a conversa e roda o ETL do idle">
            <svg class="ico" style="width:14px;height:14px" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 14.2A8.5 8.5 0 0 1 9.8 3.6a8.5 8.5 0 1 0 10.6 10.6z"/></svg>
            <span id="sw-idle-txt">Consolidar</span>
        </button>
        <!-- O canal com o mestre (mensageiro.py). O crachá de não-lidas fica AQUI, e
             não só dentro do painel: a faixa é a única coisa sempre na tela, e um
             recado esperando atrás de um painel fechado não avisa ninguém.
             ⚠ E fica ANTES do "Avançado" por medida, não por gosto: a faixa ROLA na
             horizontal, e na janela nativa (430 px) o 4º botão termina em 449 px — ou
             seja, fora da tela. O botão que carrega o aviso tem de caber sem rolar; o
             "Avançado", que não tem estado a mostrar, é quem pode ficar para depois. -->
        <button class="sw" id="sw-recados" onclick="abrirRecados()" title="Falar com o mestre: reportar um problema, pedir uma mudança ou mandar um recado">
            <svg class="ico" style="width:14px;height:14px" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3.6 7l8.4 5.6L20.4 7"/></svg>
            Recados
            <span class="cracha" id="recados-cracha" hidden></span>
        </button>
        <button class="sw" id="sw-avancado" onclick="alternarAvancado()" title="Modo avançado: ver as fontes que responderam">
            <svg class="ico" style="width:14px;height:14px" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 7h11l-2 3 2 3H4"/></svg>
            Avançado
        </button>
    </div>

    <div id="barra-acesso" role="alert">
        <span id="barra-acesso-txt"></span>
        <button class="sw" onclick="tentarAcessoDeNovo()">Tentar de novo</button>
    </div>

    <div id="toast"></div>

    <div id="welcome-screen">
        <h2 class="welcome-text">Olá</h2>
        <div class="welcome-sub">Como posso ajudar você hoje?</div>
        <div id="chips">
            <button class="chip" onclick="usarChip(this)" data-p="O que eu sei sobre ">
                <svg class="ico chip-ico" style="width:19px;height:19px" viewBox="0 0 24 24"><path d="M12 3v18M3 8h18M3 16h18"/></svg>
                Sintetizar um tema do meu vault</button>
            <button class="chip" onclick="usarChip(this)" data-p="mestre, ">
                <svg class="ico chip-ico" style="width:19px;height:19px" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>
                Dar um comando com a palavra-mestre</button>
            <button class="chip" onclick="usarChip(this)" data-p="mestre, o que eu fiz hoje?">
                <svg class="ico chip-ico" style="width:19px;height:19px" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                Revisar o que fiz hoje</button>
            <button class="chip" onclick="usarChip(this)" data-p="mestre, status do sistema">
                <svg class="ico chip-ico" style="width:19px;height:19px" viewBox="0 0 24 24"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>
                Checar a saúde do sistema</button>
        </div>
    </div>
    <div id="chat-container"></div>

    <button id="btn-descer" onclick="descer(true)" title="Ir para o fim"><svg class="ico" style="width:20px;height:20px" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>

    <div id="bottom-bar">
        <div id="composer">
            <div id="input-wrapper">
                <button class="pill-btn" onclick="enviarNotaEscrita()" title="Salvar anotação rápida"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M4 12h6"/><path d="M17.5 8.5a2.12 2.12 0 0 1 3 3L14 18l-4 1 1-4 6.5-6.5z"/></svg></button>
                <textarea id="texto-input" rows="1" placeholder="Pergunte à Mente Digital" autocomplete="off"></textarea>
                <button class="pill-btn" id="btn-send-text" onclick="enviarTexto()" style="display:none;" title="Enviar"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
            </div>
            <button id="btn-mic" onclick="toggleLiveMode()" title="Conversar por voz (Live)"><svg class="ico" style="width:26px;height:26px" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6M8 5v14M12 2.5v19M16 5v14M20 9v6"/></svg></button>
        </div>
    </div>

    <div id="avancado">
        <div class="av-top">
            <div class="av-tabs">
                <button class="av-tab on" data-aba="fontes" onclick="abrirAba('fontes')">Fontes</button>
                <button class="av-tab" data-aba="vault" onclick="abrirAba('vault')">Vault</button>
                <button class="av-tab" data-aba="consumo" onclick="abrirAba('consumo')">Consumo</button>
                <button class="av-tab" data-aba="recados" onclick="abrirAba('recados')">Recados</button>
                <button class="av-tab" data-aba="sistema" onclick="abrirAba('sistema')">Sistema</button>
            </div>
            <button class="icon-btn" onclick="alternarAvancado()" title="Fechar"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
        <div class="av-corpo">
            <section class="av-secao on" id="av-fontes"></section>
            <section class="av-secao" id="av-vault">
                <input id="av-busca" placeholder="Buscar nas suas notas…" autocomplete="off">
                <!-- Filtros (pedido do dono, 2026-08-02). As opções de pasta e
                     origem são MONTADAS a partir de /api/vault/facetas, não
                     escritas aqui: uma pasta nova no vault aparece sozinha, e
                     uma família sem nota nenhuma não é oferecida — oferecer um
                     filtro que devolve zero faz o usuário achar que quebrou. -->
                <div id="av-filtros">
                    <!-- A opção "todas" nasce no HTML, não só no JS que monta as
                         facetas: um <select> VAZIO renderiza como um cotoco de
                         ~28 px, e a varredura do vault leva ~1,6 s na primeira
                         abertura. Sem isto a tela pisca dois cotocos antes de
                         virar filtro — e continuaria assim para sempre se
                         /api/vault/facetas falhasse. -->
                    <select id="av-f-pasta" title="Pasta do vault">
                        <option value="">Todas as pastas</option>
                    </select>
                    <select id="av-f-origem" title="De onde a nota veio">
                        <option value="">Toda origem</option>
                    </select>
                    <select id="av-f-dias" title="Quando a nota foi colhida">
                        <option value="0">Qualquer data</option>
                        <option value="1">Colhidas hoje</option>
                        <option value="7">Últimos 7 dias</option>
                        <option value="30">Últimos 30 dias</option>
                        <option value="90">Últimos 90 dias</option>
                    </select>
                    <button id="av-f-limpar" type="button" hidden>limpar</button>
                </div>
                <div id="av-lista"></div>
            </section>
            <section class="av-secao" id="av-consumo"></section>
            <!-- Recados: o canal com o mestre. Uma aba só serve as duas pontas — quem
                 escreve vê a própria conversa com ele; o mestre vê a caixa e responde
                 dali. Quem é quem NÃO é decidido aqui: o front pergunta ao servidor
                 (GET /api/mestre/mensagens responde 403 a quem não é), que é a mesma
                 chamada que enche a lista. Ver `carregarRecados()`. -->
            <section class="av-secao" id="av-recados">
                <div id="rec-form">
                    <!-- O botão de bug pedido pelo dono: abre ESTE canal já como
                         'bug', sem formulário separado nem outro destino. -->
                    <button class="rec-btn forte" type="button" onclick="reportarProblema()">Reportar um problema</button>
                    <div id="rec-tipos">
                        <button class="rec-btn on" type="button" data-tipo="livre" onclick="escolherTipoRecado('livre')">Recado</button>
                        <button class="rec-btn" type="button" data-tipo="bug" onclick="escolherTipoRecado('bug')">Problema</button>
                        <button class="rec-btn" type="button" data-tipo="pedido" onclick="escolherTipoRecado('pedido')">Pedido</button>
                    </div>
                    <!-- 4000 = mensageiro.TEXTO_MAX. O servidor CORTA em vez de recusar
                         (quem escreveu muito não perde tudo), então o limite aqui é
                         para avisar antes, não para valer no lugar dele. -->
                    <textarea id="rec-texto" maxlength="4000" placeholder="Escreva ao mestre…"></textarea>
                    <div class="linha">
                        <button class="sw" type="button" id="rec-enviar" onclick="enviarRecado()">Enviar ao mestre</button>
                        <span class="conta" id="rec-conta"></span>
                    </div>
                </div>
                <div id="rec-lista"></div>
            </section>
            <section class="av-secao" id="av-sistema"></section>
        </div>
        <div id="av-leitor">
            <div class="av-leitor-top">
                <button class="icon-btn" onclick="fecharNota()" title="Voltar"><svg class="ico" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
                <span class="nome" id="av-leitor-nome"></span>
                <!-- O grafo é uma VISTA da nota aberta, não uma quarta aba: a
                     pergunta que ele responde ("com o que ISTO conversa?") só
                     existe depois de escolher uma nota. -->
                <button class="icon-btn" id="av-btn-grafo" onclick="alternarGrafo()"
                        title="Ver a vizinhança desta nota na malha">
                    <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.4"/><circle cx="5" cy="17" r="2.4"/><circle cx="19" cy="17" r="2.4"/><path d="M12 7.4L5.9 14.9M12 7.4l6.1 7.5M7.4 17h9.2"/></svg>
                </button>
            </div>
            <div id="av-leitor-corpo"></div>
            <div id="av-grafo" hidden></div>
        </div>
    </div>

    <div id="live-overlay">
        <div class="live-top"><span class="live-chip">Mente Digital Live</span></div>
        <div class="live-stage">
            <div class="orb-wrap">
                <div class="orb listening" id="live-orb"></div>
                <div class="ring r1"></div>
                <div class="ring r2"></div>
            </div>
            <div class="live-status-text" id="live-status">Ouvindo…</div>
            <div id="live-legenda"></div>
        </div>
        <div class="live-controls">
            <button class="live-ctrl" id="btn-mudo" onclick="alternarMudo()" title="Silenciar o microfone"><svg class="ico" style="width:26px;height:26px" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v4"/></svg></button>
            <button class="live-ctrl end" onclick="encerrarConversa()" title="Encerrar conversa"><svg class="ico" style="width:28px;height:28px" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
            <button class="live-ctrl" onclick="toggleLiveMode()" title="Minimizar (a conversa continua)"><svg class="ico" style="width:28px;height:28px" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const inputTexto = document.getElementById('texto-input');
        let ws, isLiveMode = false, iaFalando = false, audioQueue = [], currentAudio = null;
        let conversaEncerrada = false;   // true = idle (consolidando memória em 2º plano)
        let conversaId = null;           // conversa atual (agrupa os turnos no histórico)
        let audioCtx, processor, source, streamGlobal, gainNode;
        let reconnectDelay = 1000;
        let currentIaBubble = null, currentIaRaw = "";
        let microfoneMudo = false;
        let colado = true;               // o usuário está no fim da rolagem?

        function novoId() { return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
        function wsAberto() { return ws && ws.readyState === WebSocket.OPEN; }
        function wsEnviar(obj) { if (wsAberto()) ws.send(JSON.stringify(obj)); }

        // ---------- casca nativa ----------
        // A barra de título só existe quando há janela sem moldura para arrastar.
        // O pywebview injeta a ponte de forma assíncrona, daí o evento além do teste.
        function marcarNativo() { document.documentElement.classList.add('nativo'); }
        if (window.pywebview) marcarNativo();
        window.addEventListener('pywebviewready', marcarNativo);
        function janelaApi(metodo) {
            if (window.pywebview && window.pywebview.api && window.pywebview.api[metodo]) window.pywebview.api[metodo]();
        }

        // ---------- tema ----------
        // Segue o sistema por padrão; o botão fixa uma escolha, que persiste. O
        // valor 'sistema' é guardado como AUSÊNCIA de chave, então limpar o
        // localStorage devolve o comportamento automático.
        const ICO_SOL = '<circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/>';
        const ICO_LUA = '<path d="M20.4 14.2A8.5 8.5 0 0 1 9.8 3.6a8.5 8.5 0 1 0 10.6 10.6z"/>';
        function temaDoSistema() { return window.matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'escuro'; }
        function aplicarTema(tema) {
            document.documentElement.setAttribute('data-tema', tema);
            document.getElementById('ico-tema').innerHTML = tema === 'claro' ? ICO_LUA : ICO_SOL;
        }
        function alternarTema() {
            const novo = document.documentElement.getAttribute('data-tema') === 'claro' ? 'escuro' : 'claro';
            localStorage.setItem('mente_tema', novo);
            aplicarTema(novo);
        }
        aplicarTema(localStorage.getItem('mente_tema') || temaDoSistema());
        window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
            if (!localStorage.getItem('mente_tema')) aplicarTema(temaDoSistema());
        });

        // ---------- sidebar / histórico ----------
        function abrirSidebar() { renderConversas(); document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('show'); }
        function fecharSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }

        async function renderConversas() {
            const cont = document.getElementById('history-container');
            try {
                const data = await apiGet('/api/conversas');
                cont.innerHTML = '';
                if (!data.length) { cont.innerHTML = '<div class="history-empty">Nenhuma conversa ainda.<br>Comece a escrever ou falar.</div>'; return; }
                data.forEach(conv => {
                    const div = document.createElement('div');
                    div.className = 'history-item' + (conv.id === conversaId ? ' active' : '');
                    const titulo = document.createElement('div'); titulo.className = 'hi-title'; titulo.textContent = conv.titulo || 'Conversa';
                    const meta = document.createElement('div'); meta.className = 'hi-meta'; meta.textContent = conv.n + (conv.n > 1 ? ' mensagens' : ' mensagem');
                    div.appendChild(titulo); div.appendChild(meta);
                    div.onclick = () => carregarConversa(conv.id);
                    cont.appendChild(div);
                });
            } catch (err) {
                cont.innerHTML = '<div class="history-empty">Não consegui carregar o histórico.<br>'
                               + escapeHtml(motivoFalha(err)) + '</div>';
            }
        }

        function limparChatView() {
            chatContainer.innerHTML = ''; chatContainer.style.display = 'none';
            document.getElementById('welcome-screen').style.display = 'flex';
            currentIaBubble = null; currentIaRaw = ''; pensando(false);
        }

        // "Novo chat": encerra (consolida) a conversa atual se tiver conteúdo, e começa uma limpa.
        function novoChat() {
            fecharSidebar();
            if (chatContainer.children.length > 0) wsEnviar({ tipo: "end_session" });
            conversaId = novoId();
            wsEnviar({ tipo: "nova_conversa", id: conversaId });
            limparChatView();
            setIdle(false);
            inputTexto.focus();
        }

        // Reabre uma conversa do histórico e recarrega o contexto no backend para continuar.
        async function carregarConversa(id) {
            fecharSidebar();
            try {
                const turnos = await apiGet('/api/conversa/' + encodeURIComponent(id));
                limparChatView();
                turnos.forEach(t => { appendMsg(t.q, 'user'); if (t.a) appendMsg(t.a, 'ia'); });
                currentIaBubble = null;
                conversaId = id;
                setIdle(false);
                wsEnviar({ tipo: "carregar_conversa", id });
                descer(true);
            } catch (err) { toast("Não abri a conversa. " + motivoFalha(err)); }
        }

        // ---------- ciclo de sessão (idle) ----------
        function setIdle(on) {
            conversaEncerrada = on;
            document.body.classList.toggle('idle', on);
            document.getElementById('sw-idle-txt').textContent = on ? 'Consolidando…' : 'Consolidar';
        }
        function encerrarConversa() {
            if (conversaEncerrada) return;
            if (isLiveMode) encerrarLiveMode(false);
            if (wsAberto()) { wsEnviar({ tipo: "end_session" }); toast("Conversa encerrada. Consolidando memória em segundo plano…"); }
            else { toast("Sem conexão — será consolidada ao reconectar."); }
            setIdle(true);
        }
        function abrirConversa() { if (conversaEncerrada) setIdle(false); }

        let toastTimer = null;
        function toast(msg) {
            const el = document.getElementById('toast');
            el.innerText = msg; el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
        }

        async function enviarNotaEscrita() {
            const txt = inputTexto.value.trim();
            if (!txt) { toast("Escreva a nota no campo primeiro."); return; }
            limparComposer();
            try {
                // `res.ok` aqui não é higiene, é a diferença entre salvar e MENTIR que
                // salvou: sem a checagem, um 401 devolvia "salva no Obsidian" e o texto
                // ia junto com o composer que já foi limpo — a nota some sem rastro.
                const res = await fetch('/api/nota/texto', { method: 'POST', headers: apiHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify({ texto: txt }) });
                if (!res.ok) { const e = new Error('http ' + res.status); e.status = res.status; throw e; }
                appendMsg("📝 Anotação manual salva no Obsidian.", 'ia');
            } catch (err) {
                toast("Falha ao salvar a nota. " + motivoFalha(err));
                inputTexto.value = txt;      // devolve o texto: o composer já foi limpo
                ajustarAltura();
            }
        }

        // ---------- markdown seguro ----------
        function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
        function parseMarkdown(text) {
            const blocks = [];
            text = text.replace(/```(\w+)?\n?([\s\S]*?)```/g, (m, lang, code) => {
                blocks.push('<pre class="code"><code>' + escapeHtml(code.replace(/\n$/, '')) + '</code></pre>');
                return '%%MDCODE' + (blocks.length - 1) + 'ENDCODE%%';
            });
            text = escapeHtml(text);
            // FIGURAS (Fase 5b): `![[Figuras/x.webp]]` do Obsidian vira <img>. Roda
            // DEPOIS do escapeHtml e monta o src com encodeURIComponent por segmento,
            // então nada vindo do LLM/vault escapa para dentro do HTML. Só o formato
            // wikilink é aceito — markdown de imagem com URL externa NÃO, senão uma
            // nota envenenada pela web faria o navegador buscar um servidor de fora
            // (o pilar é 100% local). Ver mente_digital/imagem_web.py.
            text = text.replace(/!\[\[([^\]|]+?\.(?:webp|png|jpe?g|gif|svg))(?:\|[^\]]*)?\]\]/gi, (m, caminho) => {
                const src = caminho.trim().split('/').map(encodeURIComponent).join('/');
                const nome = escapeHtml(caminho.split('/').pop());
                return `<img class="fig" loading="lazy" alt="${nome}" src="/api/imagem/${src}${imgToken()}">`;
            });
            text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
            text = text.replace(/^### (.*)$/gm, '<h4>$1</h4>')
                       .replace(/^## (.*)$/gm, '<h3>$1</h3>')
                       .replace(/^# (.*)$/gm, '<h2>$1</h2>');
            text = text.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
            text = text.replace(/(^|[^*])\*([^*\n]+?)\*/g, '$1<i>$2</i>');
            text = text.replace(/^\s*[-*] (.*)$/gm, '• $1');
            text = text.replace(/\n/g, '<br>');
            text = text.replace(/%%MDCODE(\d+)ENDCODE%%/g, (m, i) => blocks[parseInt(i)]);
            return text;
        }

        // ---------- rolagem ----------
        // "Colado no fim" é decidido pela posição do usuário, não presumido: quem
        // rolou para cima lendo uma resposta longa não é arrastado de volta a cada token.
        chatContainer.addEventListener('scroll', () => {
            const resto = chatContainer.scrollHeight - chatContainer.scrollTop - chatContainer.clientHeight;
            colado = resto < 90;
            document.getElementById('btn-descer').classList.toggle('show', !colado && chatContainer.children.length > 0);
        });
        function descer(forcar) {
            if (!forcar && !colado) return;
            chatContainer.scrollTop = chatContainer.scrollHeight;
            colado = true;
            document.getElementById('btn-descer').classList.remove('show');
        }

        function pensando(on) {
            let el = document.getElementById('pensando');
            if (on) {
                if (!el) {
                    el = document.createElement('div'); el.id = 'pensando';
                    el.innerHTML = '<i></i><i></i><i></i>';
                    chatContainer.appendChild(el);
                }
                el.classList.add('on'); descer();
            } else if (el) { el.remove(); }
        }

        function appendMsg(txt, sender) {
            document.getElementById('welcome-screen').style.display = 'none';
            chatContainer.style.display = 'flex';
            pensando(false);
            const row = document.createElement('div'); row.className = `msg-row ${sender}`;
            const bubble = document.createElement('div'); bubble.className = `bubble ${sender}`;
            bubble.innerHTML = parseMarkdown(txt);
            bubble.dataset.raw = txt;
            row.appendChild(bubble);
            if (sender === 'ia') row.appendChild(montarAcoes(bubble));
            chatContainer.appendChild(row); descer();
            return bubble;
        }

        function montarAcoes(bubble) {
            const box = document.createElement('div'); box.className = 'acoes';
            const b = document.createElement('button');
            b.className = 'acao-btn'; b.title = 'Copiar'; b.setAttribute('aria-label', 'Copiar resposta');
            b.innerHTML = '<svg class="ico" style="width:17px;height:17px" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
            b.onclick = () => {
                navigator.clipboard.writeText(bubble.dataset.raw || bubble.innerText)
                    .then(() => toast("Copiado."))
                    .catch(() => toast("Não consegui copiar."));
            };
            box.appendChild(b);
            return box;
        }

        function atualizarEstadoOrb(estado) {
            document.getElementById('live-orb').className = 'orb ' + estado;
            const statusText = document.getElementById('live-status');
            if (estado === 'listening') statusText.innerText = microfoneMudo ? "Microfone silenciado" : "Ouvindo…";
            else if (estado === 'thinking') statusText.innerText = "Processando…";
            else if (estado === 'speaking') statusText.innerText = "Respondendo…";
            else if (estado === 'dormindo') statusText.innerText = "Dormindo — diga 'mestre'";
        }

        // ---------- composer ----------
        function ajustarAltura() {
            inputTexto.style.height = 'auto';
            inputTexto.style.height = Math.min(inputTexto.scrollHeight, 132) + 'px';
        }
        function limparComposer() {
            inputTexto.value = ''; ajustarAltura();
            document.getElementById('btn-send-text').style.display = 'none';
        }
        inputTexto.addEventListener('input', () => {
            ajustarAltura();
            document.getElementById('btn-send-text').style.display = inputTexto.value.trim() ? 'flex' : 'none';
        });
        // Enter envia; Shift+Enter quebra a linha (o campo virou textarea).
        inputTexto.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviarTexto(); }
        });
        function usarChip(el) {
            inputTexto.value = el.dataset.p;
            ajustarAltura(); inputTexto.focus();
            inputTexto.setSelectionRange(inputTexto.value.length, inputTexto.value.length);
            document.getElementById('btn-send-text').style.display = 'flex';
        }

        async function enviarTexto() {
            const txt = inputTexto.value.trim(); if (!txt) return;
            abrirConversa();
            limparComposer();
            // Descansando: religa ANTES de mandar. Sem isto o LLM voltaria sozinho
            // (ws.py chama ensure_loaded) mas o embedding não, e a resposta viria
            // sem RAG — certa na forma, cega no conteúdo, e sem nada avisando.
            if (estadoEnergia === 'descansando') {
                toast("Religando os modelos…");
                await alternarEnergia();
            }
            if (wsAberto()) {
                currentIaBubble = null;
                // A bolha do usuário NÃO é desenhada aqui: o servidor devolve o
                // texto digitado como {tipo:"transcricao"} (ws.py:496), o mesmo
                // caminho da fala transcrita, e o handler a desenha. Desenhar
                // localmente também duplicava a mensagem na tela — regressão
                // introduzida e medida em 2026-08-02. O servidor é a fonte da
                // verdade do que foi dito; a tela só reflete.
                wsEnviar({ tipo: "texto", payload: txt });
            } else {
                toast("Sem conexão com o servidor.");
            }
        }

        function tocarProximoAudio() {
            if (audioQueue.length === 0 || !isLiveMode) {
                iaFalando = false;
                if (isLiveMode) atualizarEstadoOrb('listening');
                return;
            }
            iaFalando = true;
            atualizarEstadoOrb('speaking');
            currentAudio = new Audio("data:audio/wav;base64," + audioQueue.shift());
            currentAudio.onended = () => { currentAudio = null; tocarProximoAudio(); };
            currentAudio.play().catch(err => { console.error("Erro ao tocar áudio", err); currentAudio = null; tocarProximoAudio(); });
        }

        // Acesso (#7): com MENTE_ACCESS_TOKEN no servidor, abra a página UMA vez com
        // ?token=SEGREDO — fica no localStorage e vai junto no WS e nas rotas /api.
        const _tokenUrl = new URLSearchParams(location.search).get('token');
        if (_tokenUrl) localStorage.setItem('mente_token', _tokenUrl);
        const TOKEN_ACESSO = localStorage.getItem('mente_token') || '';
        // <img> não manda header, então a figura leva o token por query — mesmo
        // tradeoff já aceito no WebSocket (o gate /api aceita header OU query).
        function imgToken() { return TOKEN_ACESSO ? '?token=' + encodeURIComponent(TOKEN_ACESSO) : ''; }
        function apiHeaders(extra) {
            const h = Object.assign({}, extra || {});
            if (TOKEN_ACESSO) h['X-Mente-Token'] = TOKEN_ACESSO;
            return h;
        }

        // Toda leitura de /api passa por aqui. Sem checar `res.ok`, o corpo de ERRO
        // ({"detail": "não autorizado"}) era consumido como se fosse a resposta boa:
        // o campo esperado vinha `undefined` e cada tela contava uma história
        // tranquilizadora. Medido em 2026-08-03 com um 401 real, o banco com 91
        // conversas e a malha PRONTA: o histórico dizia "Nenhuma conversa ainda" e o
        // grafo dizia "a malha ainda está sendo montada" — as duas MENTIRAS, e as
        // duas indistinguíveis de um servidor saudável. É o que fazia o celular
        // parecer vazio em vez de barrado. Recusa de acesso ≠ ausência de dado.
        async function apiGet(url) {
            const res = await fetch(url, { headers: apiHeaders() });
            if (!res.ok) throw await erroHttp(res);
            return res.json();
        }
        // O gêmeo de escrita. Existe pelo mesmo motivo do bloco acima: sem um ponto
        // único, cada POST novo repete o `res.ok` na mão — e o que esquecer vai tratar
        // um 401 como "enviado", que é exatamente a mentira que o `enviarNotaEscrita`
        // já teve de consertar uma vez.
        async function apiPost(url, corpo) {
            const res = await fetch(url, {
                method: 'POST',
                headers: apiHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify(corpo || {}),
            });
            if (!res.ok) throw await erroHttp(res);
            return res.json();
        }
        // O 401 do gate por aparelho tem CORPO — {"detail":{"erro":…,"motivo":"revogado"}} —
        // e é o motivo que separa o insolúvel do consertável: "revogado" só o dono
        // resolve (código novo), "credencial_invalida" o usuário resolve sozinho. Jogar
        // o corpo fora igualava os dois numa frase só, que é o mesmo erro de classe do
        // `res.ok` que este bloco já conserta uma vez.
        async function erroHttp(res) {
            const e = new Error('http ' + res.status);
            e.status = res.status;
            try {
                const corpo = await res.json();
                const d = corpo && corpo.detail;
                if (d && typeof d === 'object') e.motivo = d.motivo;
            } catch (_) { /* corpo não-JSON (proxy, 502): sobra o status, que já diz o essencial */ }
            return e;
        }
        // A mensagem tem que dizer o que FAZER. 401 no celular é quase sempre o
        // token do aparelho, e é ele que o dono consegue arrumar sozinho.
        const MOTIVO_TEXTO = {
            revogado: 'O dono revogou este aparelho. Peça um código de pareamento novo.',
            expirado: 'A credencial deste aparelho expirou. Pareie de novo para renovar.',
            bloqueado: 'Bloqueado por tentativas erradas — espere alguns minutos.',
            credencial_invalida: 'A credencial deste aparelho não confere.',
            sem_credencial: 'Este aparelho não tem credencial configurada.',
        };
        function motivoFalha(err) {
            const s = err && err.status;
            if (s === 401) return MOTIVO_TEXTO[err.motivo]
                || 'Acesso recusado — o token deste aparelho não confere.';
            if (s) return 'O servidor respondeu ' + s + '.';
            return 'Sem resposta do servidor.';
        }

        // ---------- recusa de acesso ≠ queda de rede ----------
        // ⚠ MEDIDO em 2026-08-03 (uvicorn + Chrome, `close(1008)` nas duas posições):
        // o WebSocket recusado ANTES do `accept` NÃO entrega 1008 ao navegador. O
        // uvicorn responde HTTP 403 ao handshake e o JS recebe `code=1006, reason=""`
        // — byte a byte o que ele receberia com o WiFi caído. Só a recusa DEPOIS do
        // accept (a revogação ao vivo, `derrubar()` no main.py) chega como 1008.
        //
        // Como o caso MUDO é justamente o do aparelho revogado que reabre o app, tratar
        // só o 1008 consertaria a metade que quase nunca acontece. Então: 1008 para o
        // laço na hora; socket que nem abriu PERGUNTA ao HTTP, onde o 401 tem corpo.
        let acessoNegado = false;      // o servidor disse NÃO — insistir é laço inútil
        let reconnectTimer = null;
        let falhasSemAbrir = 0;

        function pararPorRecusa(msg) {
            acessoNegado = true;
            clearTimeout(reconnectTimer);
            document.getElementById('barra-acesso-txt').textContent = msg;
            document.getElementById('barra-acesso').classList.add('show');
            document.getElementById('conn-dot').classList.remove('online');
        }

        function tentarAcessoDeNovo() {
            acessoNegado = false; falhasSemAbrir = 0; reconnectDelay = 1000;
            document.getElementById('barra-acesso').classList.remove('show');
            conectarWS();
        }

        async function checarAcesso() {
            // Rota de propósito barata (sem GPU, sem vault). Falha de REDE cai no catch
            // sem status: aí não há recusa nenhuma a anunciar e o backoff segue.
            try {
                await apiGet('/api/acesso');
            } catch (err) {
                if (err && err.status === 401) { pararPorRecusa(motivoFalha(err)); return; }
                return;
            }
            // O servidor responde e o acesso é válido, mas o socket não abre. Sobrou o
            // handshake em si (Origin ≠ Host atrás de proxy é o caso real). Isso NÃO é
            // recusa de credencial, então o laço continua — o que não pode continuar é
            // o silêncio: sem isto o app fica "quase conectado" para sempre.
            if (++falhasSemAbrir >= 3) {
                document.getElementById('barra-acesso-txt').textContent =
                    'O servidor responde, mas recusa a conexão ao vivo. Tentando de novo…';
                document.getElementById('barra-acesso').classList.add('show');
            }
        }

        function conectarWS() {
            if (acessoNegado) return;      // já ouvimos "não"; só o botão religa
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            const qs = TOKEN_ACESSO ? `?token=${encodeURIComponent(TOKEN_ACESSO)}` : '';
            ws = new WebSocket(`${proto}://${window.location.host}/ws/chat_live${qs}`);
            let abriu = false;             // por SOCKET, não global: o onclose do
                                           // anterior não pode julgar a tentativa nova
            ws.onopen = () => {
                abriu = true; falhasSemAbrir = 0;
                reconnectDelay = 1000;
                document.getElementById('barra-acesso').classList.remove('show');
                document.getElementById('conn-dot').classList.add('online');
                wsEnviar({ tipo: "set_conversa", id: conversaId });  // reassocia a conversa atual
            };
            ws.onmessage = (event) => {
                let data;
                try { data = JSON.parse(event.data); } catch (e) { return; }
                if (data.tipo === "transcricao") {
                    abrirConversa();
                    currentIaBubble = null;
                    appendMsg(data.texto, 'user');
                    pensando(true);
                    if (isLiveMode) atualizarEstadoOrb('thinking');  // processando até o 1º áudio
                }
                else if (data.tipo === "token") {
                    if (!currentIaBubble) { currentIaBubble = appendMsg("", 'ia'); currentIaRaw = ""; }
                    currentIaRaw += data.texto;
                    currentIaBubble.dataset.raw = currentIaRaw;
                    currentIaBubble.innerHTML = parseMarkdown(currentIaRaw);
                    // A legenda do Live mostra a MESMA resposta que a bolha, para o
                    // modo de voz não ficar cego quando o áudio ainda não chegou.
                    if (isLiveMode) document.getElementById('live-legenda').textContent = currentIaRaw.slice(-190);
                    descer();
                }
                else if (data.tipo === "audio") {
                    // Só enfileira áudio no modo live. Fora dele (resposta a pergunta
                    // ESCRITA), o servidor ainda sintetiza e envia, mas tocarProximoAudio
