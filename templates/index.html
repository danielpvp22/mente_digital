<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mente Digital | V2</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        :root { --bg-base: #000000; --bg-gradient: radial-gradient(circle at bottom center, #0f1c2e 0%, #000000 80%); --surface: #1E1F20; --surface-hover: #333537; --text-primary: #FFFFFF; --text-secondary: #C4C7C5; --accent-blue: #A8C7FA; --font-family: 'Google Sans', sans-serif; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family); }
        body { background: var(--bg-gradient); color: var(--text-primary); display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

        #sidebar { position: absolute; top: 0; left: 0; bottom: 0; width: 300px; background: #131314; border-right: 1px solid rgba(255,255,255,0.1); transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1000; display: flex; flex-direction: column; }
        #sidebar.open { transform: translateX(0); }
        .sidebar-header { padding: 20px; display: flex; justify-content: space-between; align-items: center;}
        .sidebar-content { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px;}
        .history-item { background: var(--surface); padding: 12px; border-radius: 8px; font-size: 0.85rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid var(--accent-blue); cursor: pointer; transition: 0.2s;}
        .history-item:hover { background: var(--surface-hover); }
        #overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        #overlay.show { opacity: 1; pointer-events: all; }

        header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .icon-btn-header { background: none; border: none; color: var(--text-primary); cursor: pointer; display: flex; }
        .brand { display: flex; align-items: center; gap: 8px; font-weight: 500; }
        #conn-dot { width: 9px; height: 9px; border-radius: 50%; background: #F28B82; transition: background 0.3s; box-shadow: 0 0 8px currentColor; }
        #conn-dot.online { background: #81C995; }

        #welcome-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 20px; transition: opacity 0.3s; }
        .welcome-text { font-size: 1.8rem; font-weight: 400; background: linear-gradient(90deg, #fff, #bbb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px 20px 120px 20px; display: none; flex-direction: column; gap: 24px; scroll-behavior: smooth; }
        .msg-row { display: flex; width: 100%; } .msg-row.user { justify-content: flex-end; } .msg-row.ia { justify-content: flex-start; }
        .bubble { max-width: 85%; padding: 12px 18px; font-size: 1rem; line-height: 1.5; border-radius: 20px; overflow-wrap: anywhere; }
        .bubble.user { background: var(--surface-hover); border-bottom-right-radius: 4px; }
        .bubble.ia { background: transparent; color: var(--text-primary); padding-left: 0;}
        .bubble h2, .bubble h3, .bubble h4 { margin: 6px 0; line-height: 1.3; }
        .bubble code { background: #2a2d2e; padding: 1px 6px; border-radius: 5px; font-family: 'Consolas','Menlo',monospace; font-size: 0.9em; }
        .bubble pre.code { background: #0d0f11; border: 1px solid rgba(255,255,255,0.08); padding: 12px 14px; border-radius: 10px; overflow-x: auto; margin: 8px 0; }
        .bubble pre.code code { background: none; padding: 0; display: block; white-space: pre; }

        #toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: var(--surface); color: var(--text-secondary); padding: 10px 18px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 6px 20px rgba(0,0,0,0.5); font-size: 0.85rem; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 3000; }
        #toast.show { opacity: 1; }

        #bottom-bar { position: fixed; bottom: 20px; left: 0; width: 100%; display: flex; align-items: flex-end; justify-content: center; padding: 0 15px; z-index: 50; gap: 10px; }
        .action-btn { background: var(--surface); color: var(--text-primary); border: 1px solid rgba(255,255,255,0.1); width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: 0.2s; flex-shrink: 0; }
        .action-btn:hover { background: var(--surface-hover); }

        #input-wrapper { flex: 1; max-width: 600px; background: var(--surface); border-radius: 32px; display: flex; align-items: center; padding: 6px 12px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        #texto-input { flex: 1; background: transparent; border: none; color: var(--text-primary); font-size: 1rem; padding: 10px; outline: none; min-width: 0; }

        .btn-live { background: rgba(168, 199, 250, 0.1); color: var(--accent-blue); width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: 0.3s; flex-shrink: 0;}
        .btn-live.active { background: #F28B82; color: #fff; box-shadow: 0 0 30px rgba(242, 139, 130, 0.4); animation: pulse-mic 1.5s infinite alternate; }
        @keyframes pulse-mic { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }

        #live-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg-base); background-image: radial-gradient(circle at center, #0f1c2e 0%, #000000 100%); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
        #live-overlay.active { opacity: 1; pointer-events: auto; }
        .close-live { position: absolute; top: 20px; right: 20px; color: white; background: none; border: none; cursor: pointer; }
        .orb { width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, #A8C7FA, #D3E3FD); box-shadow: 0 0 50px rgba(168, 199, 250, 0.4); transition: all 0.3s ease; }
        .orb.listening { animation: pulse-orb 2s infinite ease-in-out; }
        .orb.thinking { animation: spin-orb 1.5s infinite linear, pulse-orb 1s infinite alternate; border-radius: 35%; }
        .orb.speaking { background: linear-gradient(135deg, #F28B82, #FAD2CF); box-shadow: 0 0 70px rgba(242, 139, 130, 0.5); animation: expand-orb 0.3s infinite alternate; }
        .live-status-text { margin-top: 50px; font-size: 1.3rem; color: var(--text-secondary); text-align: center; padding: 0 20px;}
        @keyframes pulse-orb { 0% { transform: scale(1); box-shadow: 0 0 50px rgba(168, 199, 250, 0.4); } 50% { transform: scale(1.15); box-shadow: 0 0 80px rgba(168, 199, 250, 0.6); } 100% { transform: scale(1); box-shadow: 0 0 50px rgba(168, 199, 250, 0.4); } }
        @keyframes spin-orb { 100% { transform: rotate(360deg); } }
        @keyframes expand-orb { 0% { transform: scale(1.05); } 100% { transform: scale(1.25); } }
    </style>
</head>
<body>
    <div id="overlay" onclick="toggleSidebar()"></div>
    <nav id="sidebar">
        <div class="sidebar-header">
            <span>Histórico</span>
            <button class="icon-btn-header" onclick="toggleSidebar()"><span class="material-symbols-outlined">close</span></button>
        </div>
        <div class="sidebar-content" id="history-container"></div>
    </nav>

    <header>
        <button class="icon-btn-header" onclick="abrirHistorico()"><span class="material-symbols-outlined">history</span></button>
        <div class="brand"><span id="conn-dot" title="Conexão"></span> Mente Digital</div>
        <div style="width: 24px;"></div>
    </header>

    <div id="toast"></div>
    <div id="welcome-screen"><h2 class="welcome-text">Como posso ajudar?</h2></div>
    <div id="chat-container"></div>

    <div id="bottom-bar">
        <button class="action-btn" onclick="enviarNotaEscrita()" title="Salvar anotação rápida"><span class="material-symbols-outlined">edit_document</span></button>

        <div id="input-wrapper">
            <input type="text" id="texto-input" placeholder="Pesquisar ou conversar..." autocomplete="off">
            <button class="icon-btn-header" id="btn-send-text" onclick="enviarTexto()" style="display: none; color: var(--accent-blue);"><span class="material-symbols-outlined">send</span></button>
        </div>
        <button id="btn-mic" class="btn-live" onclick="toggleLiveMode()"><span class="material-symbols-outlined" style="font-size: 28px;">mic</span></button>
    </div>

    <div id="live-overlay">
        <button class="close-live" onclick="toggleLiveMode()"><span class="material-symbols-outlined" style="font-size: 32px;">keyboard_arrow_down</span></button>
        <div class="orb listening" id="live-orb"></div>
        <div class="live-status-text" id="live-status">Ouvindo...</div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const inputTexto = document.getElementById('texto-input');
        let ws, isLiveMode = false, iaFalando = false, audioQueue = [], currentAudio = null;
        let audioCtx, processor, source, streamGlobal, gainNode;
        let reconnectDelay = 1000;
        // Bolha de IA em construção + texto bruto acumulado (render de markdown por mensagem inteira).
        let currentIaBubble = null, currentIaRaw = "";

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('show'); }

        let toastTimer = null;
        function toast(msg) {
            const el = document.getElementById('toast');
            el.innerText = msg; el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
        }

        async function abrirHistorico() {
            toggleSidebar();
            try {
                const res = await fetch('/api/historico'); const data = await res.json();
                const container = document.getElementById('history-container'); container.innerHTML = '';
                data.forEach(item => {
                    const div = document.createElement('div'); div.className = 'history-item'; div.innerText = item.q; container.appendChild(div);
                });
            } catch (err) { console.warn("Erro histórico", err); }
        }

        async function enviarNotaEscrita() {
            const txt = inputTexto.value.trim();
            if(!txt) return;
            inputTexto.value = '';
            document.getElementById('btn-send-text').style.display = 'none';
            try {
                await fetch('/api/nota/texto', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({texto: txt}) });
                appendMsg("Anotação manual salva no Obsidian.", 'ia');
            } catch (err) { toast("Falha ao salvar a nota."); }
        }

        // --- Markdown seguro (escapa HTML, depois formata) ---
        function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
        function parseMarkdown(text) {
            const blocks = [];
            text = text.replace(/```(\w+)?\n?([\s\S]*?)```/g, (m, lang, code) => {
                blocks.push('<pre class="code"><code>' + escapeHtml(code.replace(/\n$/,'')) + '</code></pre>');
                return '%%MDCODE' + (blocks.length - 1) + 'ENDCODE%%';
            });
            text = escapeHtml(text);
            text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
            text = text.replace(/^### (.*)$/gm, '<h4>$1</h4>')
                       .replace(/^## (.*)$/gm, '<h3>$1</h3>')
                       .replace(/^# (.*)$/gm, '<h2>$1</h2>');
            text = text.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
            text = text.replace(/(^|[^*])\*([^*\n]+?)\*/g, '$1<i>$2</i>');
            text = text.replace(/^\s*[-*] (.*)$/gm, '• $1');
            text = text.replace(/\n/g, '<br>');
            text = text.replace(/%%MDCODE(\d+)ENDCODE%%/g, (m, i) => blocks[parseInt(i)]);
            return text;
        }

        function appendMsg(txt, sender) {
            document.getElementById('welcome-screen').style.display = 'none';
            chatContainer.style.display = 'flex';
            const row = document.createElement('div'); row.className = `msg-row ${sender}`;
            const bubble = document.createElement('div'); bubble.className = `bubble ${sender}`; bubble.innerHTML = parseMarkdown(txt);
            row.appendChild(bubble); chatContainer.appendChild(row); chatContainer.scrollTop = chatContainer.scrollHeight;
            return bubble;
        }

        function atualizarEstadoOrb(estado) {
            document.getElementById('live-orb').className = 'orb ' + estado;
            const statusText = document.getElementById('live-status');
            if (estado === 'listening') statusText.innerText = "Ouvindo...";
            else if (estado === 'thinking') statusText.innerText = "Processando...";
            else if (estado === 'speaking') statusText.innerText = "Respondendo...";
        }

        inputTexto.addEventListener('input', () => { document.getElementById('btn-send-text').style.display = inputTexto.value.trim() ? 'block' : 'none'; });
        inputTexto.addEventListener('keypress', e => { if (e.key === 'Enter') enviarTexto(); });

        function enviarTexto() {
            const txt = inputTexto.value.trim(); if(!txt) return;
            inputTexto.value = ''; document.getElementById('btn-send-text').style.display = 'none';
            if (ws && ws.readyState === WebSocket.OPEN) {
                currentIaBubble = null;   // próxima resposta abre uma bolha nova
                ws.send(JSON.stringify({ tipo: "texto", payload: txt }));
                atualizarEstadoOrb('thinking');
            } else {
                toast("Sem conexão com o servidor.");
            }
        }

        function tocarProximoAudio() {
            if (audioQueue.length === 0 || !isLiveMode) {
                iaFalando = false;
                if (isLiveMode) atualizarEstadoOrb('listening');
                return;
            }
            iaFalando = true;
            atualizarEstadoOrb('speaking');
            currentAudio = new Audio("data:audio/wav;base64," + audioQueue.shift());
            currentAudio.onended = () => { currentAudio = null; tocarProximoAudio(); };
            currentAudio.play().catch(err => { console.error("Erro ao tocar áudio", err); currentAudio = null; tocarProximoAudio(); });
        }

        function conectarWS() {
            ws = new WebSocket(`ws://${window.location.host}/ws/chat_live`);
            ws.onopen = () => {
                reconnectDelay = 1000;
                document.getElementById('conn-dot').classList.add('online');
            };
            ws.onmessage = (event) => {
                let data;
                try { data = JSON.parse(event.data); } catch (e) { return; }
                if (data.tipo === "transcricao") {
                    currentIaBubble = null;      // fecha a bolha de IA anterior
                    appendMsg(data.texto, 'user');
                }
                else if (data.tipo === "token") {
                    if (!currentIaBubble) { currentIaBubble = appendMsg("", 'ia'); currentIaRaw = ""; }
                    currentIaRaw += data.texto;
                    currentIaBubble.innerHTML = parseMarkdown(currentIaRaw);
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }
                else if (data.tipo === "audio") { audioQueue.push(data.base64); if (!iaFalando) tocarProximoAudio(); }
                else if (data.tipo === "status") { toast(data.texto); }
                else if (data.tipo === "erro") { toast("Erro: " + data.texto); }
            };
            ws.onclose = () => {
                document.getElementById('conn-dot').classList.remove('online');
                setTimeout(conectarWS, reconnectDelay);
                reconnectDelay = Math.min(reconnectDelay * 1.6, 15000);  // backoff exponencial
            };
            ws.onerror = () => { try { ws.close(); } catch (e) {} };
        }

        // Teardown do modo voz. enviarFim=true manda o gatilho de ETL pro backend.
        function encerrarLiveMode(enviarFim) {
            isLiveMode = false;
            document.getElementById('btn-mic').classList.remove('active');
            document.getElementById('live-overlay').classList.remove('active');
            iaFalando = false; audioQueue = [];
            if (currentAudio) { currentAudio.pause(); currentAudio = null; }
            atualizarEstadoOrb('listening');
            try {
                if (processor) processor.disconnect();
                if (source) source.disconnect();
                if (streamGlobal) streamGlobal.getTracks().forEach(t => t.stop());
                if (audioCtx && audioCtx.state !== 'closed') audioCtx.close();
            } catch (e) { console.warn("teardown de áudio", e); }
            processor = source = streamGlobal = audioCtx = null;
            if (enviarFim && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ tipo: "end_session" }));
            }
        }

        async function toggleLiveMode() {
            const btn = document.getElementById('btn-mic');

            if (isLiveMode) {          // desligar
                encerrarLiveMode(true);
                return;
            }

            isLiveMode = true; btn.classList.add('active');
            document.getElementById('live-overlay').classList.add('active');
            atualizarEstadoOrb('listening');

            try {
                streamGlobal = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, sampleRate: 16000 } });
                audioCtx = new AudioContext({ sampleRate: 16000 });
                source = audioCtx.createMediaStreamSource(streamGlobal);
                gainNode = audioCtx.createGain(); gainNode.gain.value = 0;
                processor = audioCtx.createScriptProcessor(1024, 1, 1);
                source.connect(processor); processor.connect(gainNode); gainNode.connect(audioCtx.destination);

                processor.onaudioprocess = function(e) {
                    if (!isLiveMode) return;
                    const inputData = e.inputBuffer.getChannelData(0);
                    let sum = 0; for(let i=0; i<inputData.length; i++) sum += Math.abs(inputData[i]);
                    let avg = sum / inputData.length;

                    if (iaFalando && avg > 0.08) {           // barge-in
                        audioQueue = []; if(currentAudio) { currentAudio.pause(); currentAudio = null; }
                        iaFalando = false; atualizarEstadoOrb('listening');
                        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ tipo: "barge_in" }));
                    }
                    if (!iaFalando && ws && ws.readyState === WebSocket.OPEN) {
                        const pcm16 = new Int16Array(inputData.length);
                        for (let i = 0; i < inputData.length; i++) pcm16[i] = Math.max(-1, Math.min(1, inputData[i])) * 32767;
                        ws.send(pcm16.buffer);
                    }
                };
            } catch (err) {
                toast("Microfone não autorizado.");
                encerrarLiveMode(false);
            }
        }
        conectarWS();
    </script>
</body>
</html>
