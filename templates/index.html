                    // não toca sem live — e o push aqui ACUMULAVA os áudios das respostas
                    // de texto, que drenavam todos ao entrar no voice depois (bug da fila).
                    if (!isLiveMode) return;
                    audioQueue.push(data.base64);
                    if (!iaFalando) tocarProximoAudio();
                }
                else if (data.tipo === "mensagem") {
                    // RECADO DE PESSOA (mensageiro.py). Vem sempre em DOIS pushes: este
                    // cartão, rico (id, quem, quando, que tipo), e logo atrás a bolha
                    // falada {tipo:"proativo"} — que é o que o servidor usa para medir a
                    // entrega e para o TTS. Desenhar os dois mostraria o mesmo recado
                    // duas vezes, e a segunda vez com a cara do assistente; por isso o
                    // cartão marca a fala gêmea e `ehEcoDeRecado` a engole. O ÁUDIO
                    // continua tocando: quem está no modo voz ouve o recado normalmente.
                    abrirConversa();
                    currentIaBubble = null;
                    mostrarRecado(data);
                    recFalaPendente = { trecho: (data.texto || '').trim().slice(0, 40), ate: Date.now() + 15000 };
                    carregarRecados(true);      // o crachá de não-lidas na faixa
                }
                else if (data.tipo === "proativo") {
                    // Mensagem que o servidor INICIA (alarme/lembrete/watcher/briefing): abre
                    // uma bolha própria com o sino, sem se colar à resposta anterior. O áudio
                    // chega em mensagens {tipo:"audio"} separadas, logo depois.
                    if (ehEcoDeRecado(data.texto)) {
                        // Gêmea do cartão que acabou de ser desenhado. O ack continua
                        // saindo: quem conclui o pendente na fila é ele, não a bolha —
                        // engolir os dois deixaria o recado sendo reentregue para sempre.
                        if (data.ack_id) wsEnviar({ tipo: "ack_proativo", id: data.ack_id });
                        return;
                    }
                    abrirConversa();
                    currentIaBubble = null;
                    appendMsg("🔔 " + data.texto, 'ia');
                    currentIaBubble = null;
                    // ACK de aplicação: confirma ao servidor que o aviso FOI exibido —
                    // só isso conclui o lembrete (send em TCP meio-aberto mente).
                    if (data.ack_id) wsEnviar({ tipo: "ack_proativo", id: data.ack_id });
                }
                else if (data.tipo === "navegar") {
                    // Navegação por voz (#14): o servidor manda operar a UI. Reusa as
                    // MESMAS funções dos botões — nada de lógica de navegação duplicada.
                    if (data.acao === "nova_conversa") novoChat();
                    else if (data.acao === "abrir_historico") abrirSidebar();
                    else if (data.acao === "fechar_historico") fecharSidebar();
                    else if (data.acao === "carregar_conversa" && data.id) carregarConversa(data.id);
                    // F3 — wake-word: o servidor avisa que acordou / dormiu o live.
                    else if (data.acao === "ativar_live") { if (isLiveMode) atualizarEstadoOrb('listening'); toast("Acordei — pode falar."); }
                    else if (data.acao === "dormir_live") { if (isLiveMode) atualizarEstadoOrb('dormindo'); toast("Dormindo — diga 'mestre' para acordar."); }
                }
                else if (data.tipo === "barge_in") {
                    // BARGE-IN DO SERVIDOR: o VAD do servidor detectou o dono falando por
                    // cima e cortou o pipeline/síntese lá — aqui descartamos o áudio que já
                    // recebemos e enfileiramos (o servidor parar de PRODUZIR não silencia o
                    // que o navegador JÁ tem no buffer). MESMO flush do barge-in do cliente
                    // (onaudioprocess). CRÍTICO: só esvazia a fila — NÃO reenvia {tipo:"barge_in"}
                    // ao servidor (o cliente é quem inicia aquele), senão fecharia um loop.
                    audioQueue = []; if (currentAudio) { currentAudio.pause(); currentAudio = null; }
                    iaFalando = false; if (isLiveMode) atualizarEstadoOrb('listening');
                }
                else if (data.tipo === "energia") {
                    // O SERVIDOR mudou de energia por conta própria (watcher de economia,
                    // 20 min sem uso) ou por ordem de OUTRA casca (celular, bandeja).
                    // Sem receber isso, esta página seguiria acreditando em 'ligado' e
                    // pularia o religar-antes-de-enviar — a resposta sairia com o RAG
                    // cego, bem formada e sem contexto, que é o defeito silencioso que
                    // o `enviarTexto` existe para evitar.
                    if (energiaOcupada) return;   // este cliente está no meio do próprio clique
                    pintarEnergia(data.estado, medidaDe(data.medida));
                    if (data.estado === 'descansando') toast("PC liberado — a próxima pergunta religa.");
                }
                else if (data.tipo === "fontes") {
                    // Proveniência da resposta que acabou de sair (modo avançado).
                    // Substitui em vez de acumular: a pergunta é "de onde veio ESTA
                    // resposta", não "tudo que já foi consultado na sessão".
                    ultimasFontes = { rota: data.rota, itens: data.itens || [] };
                    if (document.getElementById('avancado').classList.contains('active')) renderFontes();
                }
                else if (data.tipo === "status") { toast(data.texto); }
                else if (data.tipo === "erro") {
                    // UX-01 (painel 2026-07-24): erro do pipeline deixou de ser mudo.
                    // Fecha a bolha em curso e devolve o orbe ao "ouvindo" — a frase
                    // FALADA do servidor chega logo atrás como token+audio normais.
                    toast("Erro: " + data.texto);
                    currentIaBubble = null; pensando(false);
                    if (isLiveMode && !iaFalando) atualizarEstadoOrb('listening');
                }
            };
            ws.onclose = (ev) => {
                document.getElementById('conn-dot').classList.remove('online');
                // 1008 = policy violation. Ele só CHEGA aqui quando a sessão já estava
                // aberta, ou seja: o dono revogou este aparelho agora há pouco. Voltar
                // a bater na porta seria insistir contra um "não" explícito.
                if (ev && ev.code === 1008) {
                    pararPorRecusa('O acesso deste aparelho foi encerrado pelo servidor.');
                    return;
                }
                // Nem abriu: pode ser rede OU recusa (o handshake recusado chega como
                // 1006 — ver o bloco medido acima). Quem responde isso é o HTTP, em
                // paralelo; o backoff segue e o `checarAcesso` o corta se for recusa.
                if (!abriu) checarAcesso();
                reconnectTimer = setTimeout(conectarWS, reconnectDelay);
                reconnectDelay = Math.min(reconnectDelay * 1.6, 15000);
            };
            ws.onerror = () => { try { ws.close(); } catch (e) {} };
        }

        // ---------- modo live ----------
        function alternarMudo() {
            microfoneMudo = !microfoneMudo;
            document.getElementById('btn-mudo').classList.toggle('mudo-on', microfoneMudo);
            // Mudo é do CLIENTE: para de subir PCM, mas mantém o WebSocket e a
            // sessão vivos. O servidor simplesmente para de ouvir quadros.
            if (!iaFalando) atualizarEstadoOrb('listening');
            toast(microfoneMudo ? "Microfone silenciado." : "Microfone ligado.");
        }

        function encerrarLiveMode(enviarFim) {
            isLiveMode = false;
            document.getElementById('live-overlay').classList.remove('active');
            iaFalando = false; audioQueue = [];
            if (currentAudio) { currentAudio.pause(); currentAudio = null; }
            atualizarEstadoOrb('listening');
            try {
                if (processor) processor.disconnect();
                if (source) source.disconnect();
                if (streamGlobal) streamGlobal.getTracks().forEach(t => t.stop());
                if (audioCtx && audioCtx.state !== 'closed') audioCtx.close();
                if (window.MenteAndroid) window.MenteAndroid.pararMicrofone();
            } catch (e) { console.warn("teardown de áudio", e); }
            processor = source = streamGlobal = audioCtx = null;
            if (enviarFim) wsEnviar({ tipo: "end_session" });
        }

        // ---------- captura de microfone: UMA lógica, DUAS origens ----------
        // F5 (barge-in só do dono, Tier 1): só interrompe o narrador com voz ALTA
        // e SUSTENTADA. Limiar maior (0.08 -> 0.12) descarta ruído/voz de fundo mais
        // baixa; exigir BARGE_FRAMES seguidos ("mais uma chance") descarta estalos
        // curtos. NÃO distingue a SUA voz de outra igualmente alta/perto — isso é o
        // Tier 2 (speaker-ID), adiado. (~64ms/frame @16kHz -> 4 frames ≈ 250ms.)
        const BARGE_RMS = 0.12, BARGE_FRAMES = 4;
        let bargeFrames = 0;

        // Um quadro de 1024 amostras, normalizado em -1..1. Vem do
        // `ScriptProcessor` no navegador e da PONTE NATIVA no app Android — e é
        // processado pelo MESMO código nos dois casos, de propósito: duplicar o
        // barge-in daria duas noções de "voz alta" com o mesmo nome, que
        // envelheceriam separadas.
        function processarQuadroMic(inputData) {
            if (!isLiveMode) return;
            let sum = 0; for (let i = 0; i < inputData.length; i++) sum += Math.abs(inputData[i]);
            const avg = sum / inputData.length;

            // O orbe respira com a SUA voz enquanto ouve. É o mesmo número já
            // calculado para o barge-in — custo zero, e transforma a animação
            // decorativa em resposta real ao microfone.
            if (!iaFalando) {
                const orbEl = document.getElementById('live-orb');
                if (orbEl) orbEl.style.setProperty('--nivel', Math.min(1, avg * 9).toFixed(2));
            }

            if (iaFalando) {                          // barge-in gateado (F5)
                bargeFrames = avg > BARGE_RMS ? bargeFrames + 1 : 0;
                if (bargeFrames >= BARGE_FRAMES) {
                    bargeFrames = 0;
                    audioQueue = []; if (currentAudio) { currentAudio.pause(); currentAudio = null; }
                    iaFalando = false; atualizarEstadoOrb('listening');
                    wsEnviar({ tipo: "barge_in" });
                }
            } else {
                bargeFrames = 0;
                if (wsAberto() && !microfoneMudo) {
                    const pcm16 = new Int16Array(inputData.length);
                    for (let i = 0; i < inputData.length; i++) pcm16[i] = Math.max(-1, Math.min(1, inputData[i])) * 32767;
                    ws.send(pcm16.buffer);
                }
            }
        }

        // A ponte do app Android chama isto com UM quadro de 1024 amostras em
        // base64 (PCM16 little-endian), na mesma cadência de 64 ms do
        // ScriptProcessor. Existe porque `getUserMedia` exige contexto seguro e o
        // servidor sobe em HTTP — no app nativo quem grava é o `AudioRecord`, que
        // só depende da permissão RECORD_AUDIO. Mesmo padrão do `window.pywebview`
        // que a barra de título já usa: uma casca, uma capacidade.
        window.__micAndroid = function (b64) {
            try {
                const bin = atob(b64);
                const n = bin.length >> 1;
                const f = new Float32Array(n);
                for (let i = 0; i < n; i++) {
                    let v = (bin.charCodeAt(i * 2 + 1) << 8) | bin.charCodeAt(i * 2);
                    if (v >= 0x8000) v -= 0x10000;      // int16 com sinal
                    f[i] = v / 32768;
                }
                processarQuadroMic(f);
            } catch (e) { console.warn("quadro do microfone nativo ilegível", e); }
        };

        async function toggleLiveMode() {
            if (isLiveMode) { encerrarLiveMode(false); return; }

            // `window.MenteAndroid` dispensa o contexto seguro: no app nativo quem
            // grava é o AudioRecord (permissão RECORD_AUDIO), não o getUserMedia.
            if (!window.MenteAndroid && !window.isSecureContext
                && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
                toast("Voz precisa de HTTPS fora do localhost. Use o chat por texto no celular.");
                return;
            }

            abrirConversa();
            isLiveMode = true;
            // Zera qualquer áudio pendente ANTES de começar a ouvir: garante que o voice
            // fale só a resposta atual, nunca sobras de turnos anteriores (rede de segurança
            // sobre o guard do onmessage — cobre também áudio em voo na troca de modo).
            audioQueue = []; iaFalando = false;
            if (currentAudio) { currentAudio.pause(); currentAudio = null; }
            document.getElementById('live-legenda').textContent = '';
            document.getElementById('live-overlay').classList.add('active');
            atualizarEstadoOrb('listening');

            try {
                if (window.MenteAndroid) {
                    // App Android: quem grava é o AudioRecord nativo, que chama
                    // `window.__micAndroid` a cada quadro de 1024 amostras. O
                    // resto (RMS, barge-in, envio) é o MESMO código do navegador.
                    if (!window.MenteAndroid.iniciarMicrofone()) {
                        toast("Microfone não autorizado.");
                        encerrarLiveMode(false);
                    }
                    return;
                }
                streamGlobal = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, sampleRate: 16000 } });
                audioCtx = new AudioContext({ sampleRate: 16000 });
                source = audioCtx.createMediaStreamSource(streamGlobal);
                gainNode = audioCtx.createGain(); gainNode.gain.value = 0;
                processor = audioCtx.createScriptProcessor(1024, 1, 1);
                source.connect(processor); processor.connect(gainNode); gainNode.connect(audioCtx.destination);
                processor.onaudioprocess = e => processarQuadroMic(e.inputBuffer.getChannelData(0));
            } catch (err) {
                toast("Microfone não autorizado.");
                encerrarLiveMode(false);
            }
        }

        // Esc fecha o que estiver aberto, na ordem que o usuário espera.
        document.addEventListener('keydown', e => {
            if (e.key !== 'Escape') return;
            if (isLiveMode) encerrarLiveMode(false);
            // Esc desfaz UMA camada por vez: com o grafo aberto ele volta ao texto
            // da nota, não fecha o leitor inteiro (que perderia o lugar).
            else if (!document.getElementById('av-grafo').hidden) mostrarGrafo(false);
            else if (document.getElementById('av-leitor').classList.contains('on')) fecharNota();
            else if (document.getElementById('avancado').classList.contains('active')) alternarAvancado();
            else if (document.getElementById('sidebar').classList.contains('open')) fecharSidebar();
        });

        // ---------- energia (ligar/desligar os modelos) ----------
        // "Desligado" é desligado MESMO, não sono com despertar automático. O
        // servidor solta LLM, Whisper, voz e embeddings; desses, só o LLM voltaria
        // sozinho. O embedding não — e sem ele o RAG responderia sem contexto, o
        // STT devolveria vazio e o TTS ficaria mudo, os três CALADOS. Por isso
        // religar é ato explícito, e mandar mensagem enquanto descansa religa
        // ANTES de enviar (ver enviarTexto).
        let estadoEnergia = 'ligado', energiaOcupada = false;

        function pintarEnergia(estado, medida) {
            const el = document.getElementById('sw-energia');
            estadoEnergia = estado;
            el.classList.toggle('on', estado === 'ligado');
            el.classList.toggle('off', estado === 'descansando');
            el.classList.toggle('ocupado', estado === 'ocupado');
            document.getElementById('sw-energia-txt').textContent =
                estado === 'ligado' ? 'Ligado' : estado === 'descansando' ? 'Descansando' : 'Aguarde…';
            document.getElementById('sw-energia-med').textContent = medida || '';
            el.disabled = estado === 'ocupado';
        }

        // O detalhe que SAIU do chip: vai para o tooltip do próprio número, onde há
        // espaço para as ressalvas que um botão de cabeçalho não comporta. Nada foi
        // perdido — só deixou de disputar atenção com o total.
        function detalheDe(dados) {
            const m = (dados && (dados.depois || dados)) || {};
            const l = [];
            if (m.watts_total != null) {
                l.push(`Total ${Math.round(m.watts_total)} W = GPU ${Math.round(m.gpu_watts)} W`
                     + ` + CPU ${Math.round(m.cpu_watts)} W`);
            }
            if (m.gpu_watts_limite != null) l.push(`Teto do driver da GPU: ${m.gpu_watts_limite} W`);
            if (m.cpu_watts == null && m.cpu_watts_motivo) {
                // Por que falta a metade da conta, em vez de um campo mudo.
                const porque = { ausente: 'o ajudante elevado não está de pé',
                                 vencido: 'o ajudante parou de publicar',
                                 invalido: 'a publicação do ajudante está ilegível' };
                l.push(`Sem a parcela da CPU: ${porque[m.cpu_watts_motivo] || m.cpu_watts_motivo}.`);
            }
            if (m.vram_mb != null) l.push(`VRAM ${(m.vram_mb / 1024).toFixed(1)} GB`);
            if (m.ram_commit_mb != null) l.push(`RAM ${(m.ram_commit_mb / 1024).toFixed(1)} GB`);
            l.push('Watts do DISPOSITIVO inteiro, não do assistente: a GPU soma tudo que tem '
                 + 'contexto nela (desktop, navegador, jogos) e a CPU é o pacote inteiro.');
            l.push('O til (~) marca leitura instantânea; sem til é a média dos últimos ~20 s.');
            return l.join('\n');
        }

        // O que a faixa do chip mostra: memória e, desde 2026-08-03, WATTS.
        //
        // ⚠ Cada campo entra por conta própria, sem `return ''` adiantado. Antes
        // a função desistia se `vram_mb` viesse null, e watt não depende de VRAM
        // (o da GPU vem da NVML por ctypes, o da CPU vem do ajudante elevado) —
        // uma leitura de memória ausente apagaria uma medida que existe.
        //
        // ⚠ O `~` do watt da GPU não é enfeite: com ele, o número é o INSTANTE
        // sorteado (1ª leitura, ainda sem janela); sem ele, é a média por
        // integral de energia dos ~20 s desde a leitura anterior. Numa placa que
        // salta de 96 W parada para 320 W decodificando, os dois contam
        // histórias diferentes, e o til é o que separa uma da outra. O tooltip
        // do próprio span explica de quem são estes watts.
        // O que fica no CHIP é só o watt total (pedido do dono): num botão que vive
        // no cabeçalho, quatro números competindo viram nenhum. VRAM e RAM não se
        // perderam — mudaram de lugar, para o tooltip (`detalheDe`) e para a tela
        // de Consumo no Avançado, onde há espaço para lê-las com calma.
        function medidaDe(dados) {
            const m = (dados && (dados.depois || dados)) || {};
            const partes = [];

            // O til é da GPU, mas contamina o TOTAL: se a parcela maior é o
            // instante sorteado, a soma também é — não dá para rotular de média.
            const instante = m.gpu_watts_origem === 'nvml_instantaneo' ? '~' : '';
            if (m.watts_total != null) {
                partes.push(`${instante}${Math.round(m.watts_total)} W`);
            } else if (m.gpu_watts != null) {
                // Falta a parcela da CPU (acontece sempre que o ajudante elevado
                // não está de pé). O número vai ROTULADO "GPU" de propósito:
                // mostrá-lo pelado, no mesmo lugar onde o total aparece, faria
                // ~96 W passar por consumo da máquina inteira, que gasta bem mais.
                // Número plausível e errado não levanta suspeita nenhuma — e é por
                // isso que este é o único caso em que o chip usa duas palavras.
                partes.push(`${instante}${Math.round(m.gpu_watts)} W GPU`);
            } else if (m.cpu_watts != null) {
                partes.push(`${Math.round(m.cpu_watts)} W CPU`);
            }

            return partes.join(' · ');
        }

        async function energiaPost(acao) {
            const res = await fetch('/api/energia', {
                method: 'POST', headers: apiHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify({ acao }),
            });
            if (!res.ok) throw new Error('http ' + res.status);
            return res.json();
        }

        async function alternarEnergia() {
            if (energiaOcupada) return;
            const desligar = estadoEnergia === 'ligado';
            energiaOcupada = true;
            pintarEnergia('ocupado', '');
            try {
                const d = await energiaPost(desligar ? 'desligar' : 'ligar');
                pintarEnergia(d.estado, medidaDe(d));
                document.getElementById('sw-energia-med').title = detalheDe(d);
                if (d.adiado) {
                    // O servidor cedeu a vez a uma resposta em andamento. Sem esta
                    // mensagem o clique viraria um nada silencioso — o chip
                    // continuaria "Ligado" e ninguém saberia por quê.
                    toast("Tem uma resposta em andamento — tente de novo em instantes.");
                } else if (desligar && d.liberou) {
                    // Reporta o que REALMENTE caiu, medido antes/depois no servidor.
                    const v = d.liberou.vram_mb, r = d.liberou.ram_commit_mb;
                    const partes = [];
                    if (v != null) partes.push(`${(v / 1024).toFixed(1)} GB de VRAM`);
                    if (r != null) partes.push(`${(r / 1024).toFixed(1)} GB de RAM`);
                    toast(partes.length ? 'Liberado: ' + partes.join(' e ') + '.' : 'Modelos soltos.');
                } else if (!desligar) { toast("Modelos de volta."); }
            } catch (err) {
                toast("Falha ao mudar o estado de energia.");
                pintarEnergia(desligar ? 'ligado' : 'descansando', '');
            } finally { energiaOcupada = false; }
        }

        async function lerEnergia() {
            try {
                const d = await energiaPost('estado');
                pintarEnergia(d.estado, medidaDe(d));
                // O tooltip acompanha a medida. Deixá-lo fixo no HTML faria o
                // detalhe envelhecer enquanto o numero na frente dele atualiza.
                document.getElementById('sw-energia-med').title = detalheDe(d);
            }
            catch (err) { /* servidor fora do ar: o ponto de conexão já avisa */ }
        }

        // ---------- modo avançado ----------
        // Três abas: de onde veio a última resposta, o vault inteiro, e o estado
        // da máquina. Tudo lê rota que já existe; nada aqui recalcula nada.
        let ultimasFontes = null;   // null = ainda não houve resposta nesta sessão

        function alternarAvancado() {
            const el = document.getElementById('avancado');
            const abrindo = !el.classList.contains('active');
            el.classList.toggle('active', abrindo);
            document.getElementById('sw-avancado').classList.toggle('on', abrindo);
            if (abrindo) { fecharNota(); renderFontes(); }
        }

        function abrirAba(nome) {
            document.querySelectorAll('.av-tab').forEach(b => b.classList.toggle('on', b.dataset.aba === nome));
            document.querySelectorAll('.av-secao').forEach(s => s.classList.toggle('on', s.id === 'av-' + nome));
            fecharNota();
            if (nome === 'vault' && !document.getElementById('av-lista').children.length) buscarVault();
            if (nome === 'consumo') renderConsumo();
            if (nome === 'recados') carregarRecados();
            if (nome === 'sistema') renderSistema();
        }

        // ---------- mensageiro: o canal com o MESTRE ----------
        // Servidor: mente_digital/mensageiro.py (a regra, pura) + as cinco rotas do
        // main.py. Aqui NÃO mora regra de privacidade nenhuma, e isso é deliberado: a
        // tela pinta o que a rota devolveu e nada mais. Quem decide quem lê o quê é o
        // `pode_ler` de lá; cruzar esta lista com qualquer outra fonte seria justamente
        // o furo que ele existe para fechar (o mestre administra, não lê conversa alheia).
        const REC_ROTULO = { bug: 'Problema', pedido: 'Pedido', livre: 'Recado' };
        const REC_TETO = 4000;                  // = mensageiro.TEXTO_MAX
        let recTipo = 'livre';                  // o tipo escolhido no formulário
        let recEuSouMestre = null;              // null = ainda não perguntei ao servidor
        let recDados = { usuario: '', mensagens: [], nao_lidas: 0 };
        let recRespondendo = null;              // id da mensagem com a resposta aberta
        let recFalaPendente = null;             // ver `ehEcoDeRecado`

        // O rótulo sai de uma LISTA FECHADA, nunca do valor cru: um `tipo` novo (ou
        // inventado) vira "Recado" em vez de ir para a tela como veio.
        function rotuloRecado(tipo) { return REC_ROTULO[tipo] || REC_ROTULO.livre; }

        function quandoRecado(iso) {
            const d = new Date(iso || '');
            if (isNaN(d.getTime())) return '';   // carimbo estranho não vira texto na tela
            const dois = n => String(n).padStart(2, '0');
            const hora = dois(d.getHours()) + ':' + dois(d.getMinutes());
            return d.toDateString() === new Date().toDateString()
                ? hora : dois(d.getDate()) + '/' + dois(d.getMonth() + 1) + ' ' + hora;
        }

        function abaRecadosVisivel() {
            return document.getElementById('avancado').classList.contains('active')
                && document.getElementById('av-recados').classList.contains('on');
        }

        function abrirRecados(tipo) {
            if (!document.getElementById('avancado').classList.contains('active')) alternarAvancado();
            abrirAba('recados');
            if (tipo) { escolherTipoRecado(tipo); document.getElementById('rec-texto').focus(); }
        }
        // O botão de bug do dono: mesmo canal, mesma caixa, já marcado como problema.
        // Um formulário separado teria de reaprender entrega, não-lidas e resposta.
        function reportarProblema() { abrirRecados('bug'); }

        function escolherTipoRecado(t) {
            recTipo = REC_ROTULO[t] ? t : 'livre';
            document.querySelectorAll('#rec-tipos .rec-btn')
                    .forEach(b => b.classList.toggle('on', b.dataset.tipo === recTipo));
        }

        function contarRecado() {
            const n = document.getElementById('rec-texto').value.length;
            document.getElementById('rec-conta').textContent = n ? (n + '/' + REC_TETO) : '';
        }
        document.getElementById('rec-texto').addEventListener('input', contarRecado);

        async function enviarRecado() {
            const campo = document.getElementById('rec-texto');
            const txt = campo.value.trim();
            if (!txt) { toast("Escreva o recado antes de enviar."); campo.focus(); return; }
            const btn = document.getElementById('rec-enviar');
            btn.disabled = true;
            try {
                await apiPost('/api/mensagens', { texto: txt, tipo: recTipo });
                campo.value = ''; contarRecado(); escolherTipoRecado('livre');
                toast("Enviado ao mestre.");
                await carregarRecados();
            } catch (err) {
                // O texto FICA no campo. Limpar antes da confirmação apagaria justamente
                // o relato de bug que a pessoa acabou de escrever — o mesmo estrago que
                // o `enviarNotaEscrita` teve de desfazer devolvendo o texto ao composer.
                toast("Não consegui enviar. " + motivoFalha(err));
            } finally { btn.disabled = false; }
        }

        // Duas rotas, uma tela. A do mestre é tentada PRIMEIRO, e o 403 dela é a
        // RESPOSTA — não uma falha a esconder: é assim que o front descobre de que lado
        // está sem existir uma rota nova só para perguntar "eu sou o mestre?". Qualquer
        // outro status é falha de verdade e cai no catch.
        async function carregarRecados(silencioso) {
            const lista = document.getElementById('rec-lista');
            if (abaRecadosVisivel() && !silencioso && !lista.children.length) {
                lista.innerHTML = '<div class="av-vazio">Lendo os recados…</div>';
            }
            try {
                if (recEuSouMestre !== false) {
                    try {
                        const d = await apiGet('/api/mestre/mensagens?limite=200');
                        recEuSouMestre = true;
                        recDados = { usuario: d.usuario || '', mensagens: d.mensagens || [],
                                     nao_lidas: d.nao_lidas || 0 };
                        pintarRecados();
                        return;
                    } catch (err) {
                        if (!err || err.status !== 403) throw err;
                        recEuSouMestre = false;
                    }
                }
                const d = await apiGet('/api/mensagens?limite=200');
                const eu = d.usuario || '', msgs = d.mensagens || [];
                recDados = {
                    usuario: eu, mensagens: msgs,
                    // A MESMA conta do `mensageiro.nao_lidas`: só o que chegou PARA mim e
                    // ainda não foi aberto. O que eu escrevi nunca está "não lido" para
                    // mim, e contá-lo faria o crachá pedir uma leitura que não existe.
                    nao_lidas: msgs.filter(m => !m.lida && m.destinatario === eu).length,
                };
                pintarRecados();
            } catch (err) {
                // Recusa de HTTP não é caixa vazia — é o defeito de 2026-08-03 outra vez
                // (401 virando "nenhuma conversa" com 91 no banco). O crachá APAGA porque
                // o número passou a ser desconhecido, e a lista diz o motivo.
                atualizarCrachaRecados(null);
                if (abaRecadosVisivel()) {
                    lista.innerHTML = '<div class="av-vazio">Não consegui ler os recados.<br>'
                                    + escapeHtml(motivoFalha(err)) + '</div>';
                }
            }
        }

        function pintarRecados() {
            atualizarCrachaRecados(recDados.nao_lidas);
            // O crachá SEMPRE atualiza; a lista, não: um recado novo chegando enquanto o
            // mestre digita a resposta redesenharia a lista inteira e apagaria o que ele
            // escreveu — perder o texto de quem está respondendo é pior que a lista
            // ficar um recado atrás por alguns segundos.
            if (abaRecadosVisivel() && !respostaEmEdicao()) renderRecados();
        }

        function respostaEmEdicao() {
            const ta = document.querySelector('.rec-resposta textarea');
            return !!(ta && ta.value.trim());
        }

        function atualizarCrachaRecados(n) {
            const el = document.getElementById('recados-cracha');
            const tem = typeof n === 'number' && n > 0;
            el.textContent = tem ? (n > 99 ? '99+' : String(n)) : '';
            el.hidden = !tem;
            document.getElementById('sw-recados').classList.toggle('on', tem);
        }

        function renderRecados() {
            const lista = document.getElementById('rec-lista');
            lista.innerHTML = '';
            const msgs = recDados.mensagens || [];
            if (!msgs.length) {
                lista.innerHTML = '<div class="av-vazio">Nenhum recado ainda.<br>' + (recEuSouMestre
                    ? 'Quando alguém escrever, aparece aqui.'
                    : 'Escreva acima para falar com o mestre.') + '</div>';
                return;
            }
            const titulo = document.createElement('div');
            titulo.className = 'av-titulo';
            titulo.textContent = recEuSouMestre ? 'Caixa do mestre' : 'Sua conversa com o mestre';
            lista.appendChild(titulo);
            msgs.forEach(m => lista.appendChild(itemRecado(m)));
        }

        // ⚠ TODO texto de mensagem entra por textContent, aqui e no cartão do chat.
        // Ele foi escrito por OUTRA PESSOA — é o único conteúdo do app que não veio nem
        // do dono nem do modelo —, então não passa por parseMarkdown nem por innerHTML.
        function itemRecado(m) {
            const minha = m.remetente === recDados.usuario;
            const div = document.createElement('div');
            div.className = 'av-item rec-item' + (minha ? ' minha' : (m.lida ? '' : ' nova'));

            const t = document.createElement('div'); t.className = 't';
            const tag = document.createElement('span'); tag.className = 'av-tag';
            tag.textContent = rotuloRecado(m.tipo);
            const quem = document.createElement('span');
            quem.textContent = minha ? ('para ' + (m.destinatario || '?'))
                                     : ('de ' + (m.remetente || '?'));
            const hora = document.createElement('span'); hora.className = 'rec-hora';
            hora.textContent = quandoRecado(m.criada_em);
            t.appendChild(tag); t.appendChild(quem); t.appendChild(hora);

            const corpo = document.createElement('div');
            corpo.className = 's rec-corpo';
            corpo.textContent = m.texto || '';
            div.appendChild(t); div.appendChild(corpo);

            const acoes = document.createElement('div'); acoes.className = 'rec-acoes';
            // Responder é rota SÓ do mestre (main.py), então o botão só existe para ele —
            // e nunca na própria mensagem: responder a si mesmo não é caminho nenhum.
            if (recEuSouMestre === true && !minha) {
                acoes.appendChild(botaoRecado('Responder', () => abrirResposta(m.id)));
            }
            if (!minha && !m.lida) {
                acoes.appendChild(botaoRecado('Marcar como lida', () => marcarRecadoLido(m.id)));
            }
            if (acoes.children.length) div.appendChild(acoes);
            if (recRespondendo === m.id) div.appendChild(caixaResposta(m.id));
            return div;
        }

        function botaoRecado(rotulo, fn) {
            const b = document.createElement('button');
            b.type = 'button'; b.className = 'rec-btn'; b.textContent = rotulo; b.onclick = fn;
            return b;
        }

        function abrirResposta(id) {
            recRespondendo = id;
            if (abaRecadosVisivel()) renderRecados();
            else abrirRecados();          // veio do cartão do chat: abre o painel já nela
        }

        function caixaResposta(id) {
            const box = document.createElement('div'); box.className = 'rec-resposta';
            const ta = document.createElement('textarea');
            ta.placeholder = 'Responder…'; ta.maxLength = REC_TETO;
            const linha = document.createElement('div'); linha.className = 'rec-acoes';
            const enviar = botaoRecado('Enviar resposta', async () => {
                const txt = ta.value.trim();
                if (!txt) { toast("Escreva a resposta primeiro."); ta.focus(); return; }
                enviar.disabled = true;
                try {
                    // O destinatário NÃO vai no corpo: o servidor o deriva da mensagem
                    // original (mensageiro.responder). Mandar um `para` daqui seria
                    // reabrir o canal usuário→usuário que o desenho fechou.
                    await apiPost('/api/mestre/mensagens/' + encodeURIComponent(id) + '/responder',
                                  { texto: txt });
                    recRespondendo = null;
                    toast("Resposta enviada.");
                    await carregarRecados();
                } catch (err) {
                    toast("Não consegui responder. " + motivoFalha(err));
                    enviar.disabled = false;
                }
            });
            enviar.classList.add('forte');
            linha.appendChild(enviar);
            linha.appendChild(botaoRecado('Cancelar', () => { recRespondendo = null; renderRecados(); }));
            box.appendChild(ta); box.appendChild(linha);
            setTimeout(() => ta.focus(), 0);
            return box;
        }

        async function marcarRecadoLido(id) {
            try {
                const d = await apiPost('/api/mensagens/' + encodeURIComponent(id) + '/lida', {});
                // `lida:false` não é erro — é "nada mudou" (já estava lida, ou eu só a
                // escrevi). Tratá-lo como falha faria a tela acusar problema onde o
                // servidor está sendo idempotente de propósito.
                if (!d.lida) toast("Este recado já estava lido.");
                await carregarRecados();
            } catch (err) { toast("Não consegui marcar como lida. " + motivoFalha(err)); }
        }

        // O par cartão+fala sai do mesmo `entregar_mensagem` (scheduler.py), nesta ordem
        // e no MESMO socket. A fala é `mensageiro.falar()`: "<rótulo> de <quem>: " mais o
        // texto cortado em 280 chars — então os 40 primeiros caracteres do texto do
        // cartão estão SEMPRE contidos nela. É casamento por construção, não adivinhação;
        // se um dia o formato da fala mudar, o pior caso é a bolha voltar a aparecer.
        function ehEcoDeRecado(texto) {
            if (!recFalaPendente) return false;
            if (Date.now() > recFalaPendente.ate) { recFalaPendente = null; return false; }
            if (!recFalaPendente.trecho || !(texto || '').includes(recFalaPendente.trecho)) return false;
            recFalaPendente = null;     // consumo único: a próxima proativa é alarme de verdade
            return true;
        }

        // O cartão do recado dentro do chat. Não é `appendMsg`: aquilo desenha uma bolha
        // (do assistente ou do usuário) e passa o texto pelo markdown. Ver o CSS `.recado`
        // para o porquê de um recado NUNCA poder parecer o assistente falando.
        function mostrarRecado(card) {
            document.getElementById('welcome-screen').style.display = 'none';
            chatContainer.style.display = 'flex';
            pensando(false);

            const row = document.createElement('div'); row.className = 'msg-row recado';
            const cx = document.createElement('div'); cx.className = 'recado';

            const top = document.createElement('div'); top.className = 'rec-top';
            const ico = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            ico.setAttribute('class', 'ico'); ico.setAttribute('viewBox', '0 0 24 24');
            ico.setAttribute('aria-hidden', 'true');
            const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            p.setAttribute('d', 'M12 12.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM4.5 20a7.5 7.5 0 0 1 15 0');
            ico.appendChild(p);
            const de = document.createElement('span'); de.className = 'rec-de';
            de.textContent = card.remetente || 'alguém';
            const tag = document.createElement('span'); tag.className = 'av-tag';
            // `card.classe` é o tipo da MENSAGEM (bug/pedido/livre). O `card.tipo` do
            // envelope vale "mensagem" — é o que o WebSocket roteia —, então ler dele
            // daria "Recado" para todo relato de bug. Ver `_card_mensagem` no scheduler.
            tag.textContent = rotuloRecado(card.classe);
            const hora = document.createElement('span'); hora.className = 'rec-hora';
            hora.textContent = quandoRecado(card.criada_em);
            top.appendChild(ico); top.appendChild(de); top.appendChild(tag); top.appendChild(hora);

            const corpo = document.createElement('div'); corpo.className = 'rec-corpo';
            corpo.textContent = card.texto || '';       // ⚠ ver `itemRecado`: outra pessoa escreveu

            const nota = document.createElement('div'); nota.className = 'rec-nota';
            nota.textContent = 'Recado de pessoa — não é a Mente Digital falando.';

            cx.appendChild(top); cx.appendChild(corpo); cx.appendChild(nota);

            const acoes = document.createElement('div'); acoes.className = 'rec-acoes';
            if (recEuSouMestre === true) {
                acoes.appendChild(botaoRecado('Responder', () => abrirResposta(card.id)));
            }
            acoes.appendChild(botaoRecado('Marcar como lida', () => marcarRecadoLido(card.id)));
            acoes.appendChild(botaoRecado('Ver recados', () => abrirRecados()));
            cx.appendChild(acoes);

            row.appendChild(cx); chatContainer.appendChild(row); descer();
        }


        // ---------- aba Consumo: o WATTÍMETRO ----------
        // Duas camadas com QUALIDADES diferentes, e o gráfico não pode fundi-las: a
        // barra é MEDIDA (a GPU pelo contador de energia do driver, exata; a CPU
        // integrando os watts do ajudante) e o bigode é ESTIMATIVA da tomada
        // (`tomada.py`), que inclui fonte, placa-mãe, bombas, periféricos e os dois
        // monitores. Fundir as duas num número só transformaria o fato em chute
        // exatamente onde a diferença importa: a conta de luz.
        const TARIFA_PADRAO = 0.92;      // R$/kWh — o dono ajusta no campo
        function tarifa() {
            const v = parseFloat(localStorage.getItem('mente_tarifa') || TARIFA_PADRAO);
            return isFinite(v) && v > 0 ? v : TARIFA_PADRAO;
        }
        function setTarifa(v) {
            const n = parseFloat(String(v).replace(',', '.'));
            if (isFinite(n) && n > 0) { localStorage.setItem('mente_tarifa', n); renderConsumo(); }
        }

        async function renderConsumo() {
            const box = document.getElementById('av-consumo');
            box.innerHTML = '<div class="av-vazio">Lendo o medidor…</div>';
            let d;
            try { d = await apiGet('/api/consumo?dias=30&meses=12'); }
            catch (err) {
                box.innerHTML = '<div class="av-vazio">Não li o consumo.<br>'
                              + escapeHtml(motivoFalha(err)) + '</div>';
                return;
            }
            if (!d.habilitado) {
                box.innerHTML = '<div class="av-vazio">O wattímetro está desligado.</div>';
                return;
            }
            const dias = d.diario || [], meses = d.mensal || [];
            const medido = dias.reduce((a, x) => a + x.medido_wh, 0);
            const pmin = dias.reduce((a, x) => a + x.parede_min_wh, 0);
            const pmax = dias.reduce((a, x) => a + x.parede_max_wh, 0);
            const horas = dias.reduce((a, x) => a + x.segundos, 0) / 3600;
            const t = tarifa();
            const reais = (w) => 'R$ ' + (w / 1000 * t).toFixed(2).replace('.', ',');

            let html = '<div class="cs-topo">'
              + '<div><div class="cs-total">'
              + (pmax > 0 ? reais(pmin) + ' a ' + reais(pmax) : reais(medido))
              + '</div><div class="cs-sub">últimos 30 dias · '
              + horas.toFixed(1) + ' h medidas</div></div>'
              + '<div class="cs-sub">tarifa <input class="cs-tarifa" value="' + t.toFixed(2)
              + '" onchange="setTarifa(this.value)" title="R$ por kWh — está na sua conta de luz">'
              + ' R$/kWh</div></div>';

            html += '<div class="cs-legenda">'
              + '<span><i style="background:var(--acc)"></i>GPU (medido)</span>'
              + '<span><i style="background:var(--txt2)"></i>CPU (medido)</span>'
              + '<span><i style="background:#F28B82"></i>parede (estimativa, faixa)</span>'
              + '<span>barra apagada = dia mal medido</span></div>';

            html += '<div class="av-titulo">Últimos 30 dias</div><div class="cs-graf">'
                  + barrasConsumo(dias, (x) => x.dia.slice(8), 30) + '</div>';
            html += '<div class="av-titulo" style="margin-top:14px">Por mês</div><div class="cs-graf">'
                  + barrasConsumo(meses, (x) => x.mes.slice(5) + '/' + x.mes.slice(2, 4), 12) + '</div>';

            html += '<div class="cs-nota">A <b>barra</b> é o que dá para MEDIR: a GPU pelo contador '
                  + 'de energia do driver (exato) e a CPU integrando os watts do ajudante elevado. '
                  + 'O <b>bigode vermelho</b> é a estimativa do que o PC inteiro puxa da tomada — '
                  + 'fonte, placa-mãe, bombas, periféricos e os dois monitores —, e é faixa porque a '
                  + 'incerteza é real.<br>Barra apagada = dia com pouca cobertura: o medidor só conta '
                  + 'enquanto o assistente está de pé, e ele se recusa a creditar energia de período '
                  + 'que não mediu. Dia mal medido não é dia econômico.</div>';
            box.innerHTML = html;
        }

        // Barras em SVG puro — sem lib, porque a página é servida localmente e não
        // busca nada de fora (a mesma regra que faz a figura da web ser baixada pelo
        // SERVIDOR em vez de o browser ir ao domínio de origem).
        function barrasConsumo(itens, rotulo, n) {
            if (!itens.length) return '<div class="av-vazio">Ainda não há medição.</div>';
            const L = 46, T = 8, B = 22, larg = Math.max(34, Math.floor(560 / n));
            const A = 150, W = L + itens.length * larg + 8;
            const teto = Math.max(1, ...itens.map((x) => Math.max(x.medido_wh, x.parede_max_wh || 0)));
            const y = (v) => T + (A - T - B) * (1 - v / teto);
            let g = '<svg viewBox="0 0 ' + W + ' ' + A + '" width="' + W + '" height="' + A + '" role="img">';
            [0, 0.5, 1].forEach((f) => {
                const v = teto * f;
                const rot = v >= 1000 ? (v / 1000).toFixed(1) + 'k' : Math.round(v);
                g += '<line x1="' + L + '" y1="' + y(v) + '" x2="' + (W - 4) + '" y2="' + y(v)
                   + '" stroke="var(--linha)" stroke-width="1"/>'
                   + '<text x="' + (L - 5) + '" y="' + (y(v) + 3) + '" text-anchor="end" font-size="8"'
                   + ' fill="var(--txt2)">' + rot + '</text>';
            });
            const passo = Math.ceil(itens.length / 10);
            itens.forEach((x, i) => {
                const cx = L + i * larg, lb = larg * 0.6, ox = cx + larg * 0.2, base = A - B;
                const hg = (A - T - B) * (x.gpu_wh / teto), hc = (A - T - B) * (x.cpu_wh / teto);
                const mal = (x.cobertura != null && x.cobertura < 0.5) || x.dias_com_medicao === 0;
                const op = mal ? 0.35 : 1;
                const dica = rotulo(x) + ' — medido ' + x.medido_wh.toFixed(1) + ' Wh (GPU '
                           + x.gpu_wh.toFixed(1) + ' + CPU ' + x.cpu_wh.toFixed(1) + ')'
                           + (x.parede_max_wh ? ' · parede ' + x.parede_min_wh.toFixed(0) + '–'
                              + x.parede_max_wh.toFixed(0) + ' Wh' : '')
                           + (x.cobertura != null ? ' · cobertura ' + (x.cobertura * 100).toFixed(1) + '%' : '');
                g += '<g><title>' + escapeHtml(dica) + '</title>'
                   + '<rect x="' + ox + '" y="' + (base - hg) + '" width="' + lb + '" height="'
                   + Math.max(0, hg) + '" fill="var(--acc)" opacity="' + op + '"/>'
                   + '<rect x="' + ox + '" y="' + (base - hg - hc) + '" width="' + lb + '" height="'
                   + Math.max(0, hc) + '" fill="var(--txt2)" opacity="' + op + '"/>';
                if (x.parede_max_wh > 0) {
                    const y1 = y(x.parede_min_wh), y2 = y(x.parede_max_wh), mx = ox + lb / 2;
                    g += '<line x1="' + mx + '" y1="' + y1 + '" x2="' + mx + '" y2="' + y2
                       + '" stroke="#F28B82" stroke-width="1.5"/>'
                       + '<line x1="' + (mx - 3) + '" y1="' + y2 + '" x2="' + (mx + 3) + '" y2="' + y2
                       + '" stroke="#F28B82" stroke-width="1.5"/>';
                }
                if (i % passo === 0) {
                    g += '<text x="' + (ox + lb / 2) + '" y="' + (A - 7) + '" text-anchor="middle"'
                       + ' font-size="8" fill="var(--txt2)">' + escapeHtml(rotulo(x)) + '</text>';
                }
                g += '</g>';
            });
            return g + '</svg>';
        }

        // --- aba 1: fontes da última resposta ---
        // Os itens chegam no {tipo:"fontes"} que o servidor emite ao fim do
        // pipeline. Três formatos, um por origem: "memoria", "nota:<arquivo>",
        // "web:<dominio>". Só "nota:" é clicável — é a única que existe em disco.
        function renderFontes() {
            const box = document.getElementById('av-fontes');
            if (!ultimasFontes || !ultimasFontes.itens.length) {
                box.innerHTML = '<div class="av-vazio">Nenhuma resposta nesta sessão ainda.<br>Pergunte algo e volte aqui para ver de onde veio.</div>';
                return;
            }
            box.innerHTML = `<div class="av-titulo">Rota: ${escapeHtml(ultimasFontes.rota || '?')}</div>`;
            ultimasFontes.itens.forEach(item => {
                const div = document.createElement('div');
                div.className = 'av-item';
                if (item.startsWith('nota:')) {
                    const caminho = item.slice(5);
                    div.innerHTML = `<div class="t"><span class="av-tag">vault</span>${escapeHtml(caminho.split('/').pop())}</div>`
                                  + `<div class="s">${escapeHtml(caminho)}</div>`;
                    div.onclick = () => abrirNota(caminho);
                } else if (item.startsWith('web:')) {
                    const d = item.slice(4) || '(sem domínio)';
                    div.innerHTML = `<div class="t"><span class="av-tag">web</span>${escapeHtml(d)}</div>`;
                    div.style.cursor = 'default';
                } else {
                    div.innerHTML = `<div class="t"><span class="av-tag">memória</span>Contexto desta conversa</div>`;
                    div.style.cursor = 'default';
                }
                box.appendChild(div);
            });
        }

        // --- aba 2: navegador do vault ---
        let buscaTimer = null;
        let facetasCarregadas = false;
        document.getElementById('av-busca').addEventListener('input', () => {
            clearTimeout(buscaTimer); buscaTimer = setTimeout(buscarVault, 350);
        });
        // Os filtros NÃO usam debounce: um <select> muda por escolha deliberada,
        // não por digitação, e esperar 350 ms depois do clique parece travamento.
        ['av-f-pasta', 'av-f-origem', 'av-f-dias'].forEach(id => {
            document.getElementById(id).addEventListener('change', buscarVault);
        });
        document.getElementById('av-f-limpar').addEventListener('click', () => {
            document.getElementById('av-f-pasta').value = '';
            document.getElementById('av-f-origem').value = '';
            document.getElementById('av-f-dias').value = '0';
            buscarVault();
        });

        function filtrosVault() {
            return {
                pasta: document.getElementById('av-f-pasta').value,
                origem: document.getElementById('av-f-origem').value,
                dias: document.getElementById('av-f-dias').value,
            };
        }

        async function carregarFacetas() {
            // Uma vez por sessão: a varredura custa ~1,6 s no vault do dono
            // (24.838 notas) e o servidor já a cacheia por 2 min. Falhar aqui
            // deixa os filtros vazios e a busca segue funcionando sem eles.
            if (facetasCarregadas) return;
            try {
                const d = await apiGet('/api/vault/facetas');
                const opt = (v, t) => `<option value="${escapeHtml(v)}">${escapeHtml(t)}</option>`;
                document.getElementById('av-f-pasta').innerHTML =
                    opt('', 'Todas as pastas') + d.pastas.map(p => opt(p.valor, `${p.valor} (${p.n})`)).join('');
                document.getElementById('av-f-origem').innerHTML =
                    opt('', 'Toda origem') + d.familias.map(f => opt(f.valor, `${f.rotulo} (${f.n})`)).join('');
                facetasCarregadas = true;
            } catch (err) { /* filtros ficam vazios; a busca continua */ }
        }

        async function buscarVault() {
            carregarFacetas();
            const q = document.getElementById('av-busca').value.trim();
            const f = filtrosVault();
            const ativo = !!(f.pasta || f.origem || f.dias !== '0');
            document.getElementById('av-f-limpar').hidden = !ativo;
            const lista = document.getElementById('av-lista');
            lista.innerHTML = '<div class="av-vazio">Buscando…</div>';
            try {
                const p = new URLSearchParams({ k: 30, q, pasta: f.pasta, origem: f.origem, dias: f.dias });
                const d = await apiGet('/api/notas?' + p.toString());
                lista.innerHTML = '';
                if (!d.itens.length) {
                    // Distingue "não existe" de "seus filtros cortaram" — sem isso o
                    // usuário conclui que a busca quebrou e não que ele mesmo filtrou.
                    lista.innerHTML = ativo
                        ? '<div class="av-vazio">Nada com estes filtros. Tente limpar um deles.</div>'
                        : '<div class="av-vazio">Nada encontrado.</div>';
                    return;
                }
                const cab = document.createElement('div');
                cab.className = 'av-titulo';
                // Diz QUAL busca rodou: a semântica é a mesma que o assistente usa,
                // então esta tela também serve para depurar o RAG, não só navegar.
                let texto = d.modo === 'semantica'
                    ? 'Busca semântica — a mesma do assistente' : 'Notas modificadas mais recentemente';
                if (d.total_filtrado != null && d.total_filtrado > d.itens.length)
                    texto += ` — ${d.itens.length} de ${d.total_filtrado}`;
                cab.textContent = texto;
                lista.appendChild(cab);
                d.itens.forEach(it => {
                    const div = document.createElement('div');
                    div.className = 'av-item';
                    const dist = it.dist != null ? `<span class="av-tag">${it.dist}</span>` : '';
                    // A origem e a data COLHIDA viram etiqueta: é o que responde
                    // "de onde veio isto?" sem precisar abrir a nota.
                    const fam = it.familia ? `<span class="av-tag">${escapeHtml(it.familia)}</span>` : '';
                    const dt = it.colhido_em ? `<span class="av-tag">${escapeHtml(it.colhido_em)}</span>` : '';
                    div.innerHTML = `<div class="t">${dist}${fam}${dt}${escapeHtml(it.nome)}</div>`
                                  + (it.trecho ? `<div class="s">${escapeHtml(it.trecho)}…</div>` : '');
                    div.onclick = () => abrirNota(it.caminho);
                    lista.appendChild(div);
                });
            } catch (err) { lista.innerHTML = '<div class="av-vazio">Falha ao buscar.<br>' + escapeHtml(motivoFalha(err)) + '</div>'; }
        }

        let notaAberta = null;

        async function abrirNota(caminho) {
            const leitor = document.getElementById('av-leitor');
            notaAberta = caminho;
            mostrarGrafo(false);          // trocar de nota sempre volta ao texto
            document.getElementById('av-leitor-nome').textContent = caminho.split('/').pop();
            document.getElementById('av-leitor-corpo').innerHTML = '<div class="av-vazio">Abrindo…</div>';
            leitor.classList.add('on');
            try {
                const d = await apiGet('/api/nota?caminho=' + encodeURIComponent(caminho));
                // Mesmo parseMarkdown do chat: os wikilinks de figura viram <img> e o
                // escape contra HTML injetado da nota é o mesmo. Um renderizador só.
                document.getElementById('av-leitor-corpo').innerHTML = parseMarkdown(d.texto);
            } catch (err) {
                document.getElementById('av-leitor-corpo').innerHTML =
                    '<div class="av-vazio">Não consegui abrir esta nota.<br>' + escapeHtml(motivoFalha(err)) + '</div>';
            }
        }
        function fecharNota() {
            document.getElementById('av-leitor').classList.remove('on');
            mostrarGrafo(false);
            notaAberta = null;
        }

        // ---------------------- grafo da vizinhança ----------------------
        // SVG desenhado aqui, sem biblioteca. As duas páginas do graphify puxam
        // `vis-network` do unpkg.com: servi-las quebraria o pilar "100% local" e,
        // offline, elas nem renderizam. Para 1-2 saltos (dezenas de nós) um layout
        // radial resolve — e é determinístico, ao contrário de um force layout,
        // que redesenha diferente a cada abertura e impede reconhecer a forma.
        const G = { W: 400, H: 400, RAIO: [0, 118, 178], PONTO: [9, 6, 4.5] };

        function mostrarGrafo(ligado) {
            document.getElementById('av-grafo').hidden = !ligado;
            document.getElementById('av-leitor-corpo').style.display = ligado ? 'none' : '';
            document.getElementById('av-btn-grafo').classList.toggle('on', ligado);
        }

        function alternarGrafo() {
            const alvo = document.getElementById('av-grafo').hidden;
            mostrarGrafo(alvo);
            if (alvo) desenharGrafo(notaAberta);
        }

        function corDoSalto(s) { return s === 0 ? 'var(--acc3)' : s === 1 ? 'var(--acc2)' : 'var(--acc1)'; }

        function posicoesDoGrafo(nos, arestas) {
            // Radial, mas por PARENTESCO: a semente no centro, o 1º salto num anel
            // em volta dela, e cada nó de 2º salto num leque em volta do SEU PAI.
            //
            // Um anel global para o 2º salto (a primeira versão) desenhava um grafo
            // que MENTIA: com uma semente de um vizinho só, os 38 netos ficavam num
            // círculo centrado na semente e todas as linhas convergiam no filho —
            // que passava a parecer o centro do assunto, enquanto a nota aberta
            // parecia periférica. Visto no navegador em 2026-08-02.
            const porSalto = {};
            nos.forEach(n => (porSalto[n.salto] = porSalto[n.salto] || []).push(n));
            const pos = {};
            (porSalto[0] || []).forEach(n => (pos[n.id] = { x: 0, y: 0 }));

            const anel1 = porSalto[1] || [];
            anel1.forEach((n, i) => {
                const a = (i / anel1.length) * 2 * Math.PI - Math.PI / 2;
                pos[n.id] = { x: G.RAIO[1] * Math.cos(a), y: G.RAIO[1] * Math.sin(a) };
            });

            // Pai de cada neto: a primeira aresta que o liga a alguém já posicionado.
            const filhos = {};
            (porSalto[2] || []).forEach(n => {
                const liga = arestas.find(a => (a.de === n.id && pos[a.para]) || (a.para === n.id && pos[a.de]));
                const pai = liga ? (liga.de === n.id ? liga.para : liga.de) : null;
                (filhos[pai] = filhos[pai] || []).push(n);
            });
            Object.keys(filhos).forEach(pai => {
                const base = pos[pai] || { x: 0, y: 0 };
                // O leque aponta para FORA (do centro para o pai): é o que impede os
                // netos de cair por cima do miolo do desenho.
                const fora = Math.atan2(base.y, base.x) || -Math.PI / 2;
                const grupo = filhos[pai], n = grupo.length;
                // Um pai com muitos filhos precisa da volta inteira; com poucos, um
                // leque estreito lê melhor do que um círculo quase vazio.
                const abertura = Math.min(2 * Math.PI, 0.55 * n + 0.9);
                const r = G.RAIO[2] * (n > 12 ? 1 : 0.72);
                grupo.forEach((f, i) => {
                    const a = fora - abertura / 2 + (n === 1 ? abertura / 2 : (i / (n - 1)) * abertura);
                    pos[f.id] = { x: base.x + r * Math.cos(a), y: base.y + r * Math.sin(a) };
                });
            });

            // ENQUADRAMENTO: o leque pode sair do quadro. Em vez de chutar raios que
            // caibam sempre, mede-se o que foi desenhado e encaixa-se na viewBox.
            const ps = Object.values(pos);
            if (!ps.length) return pos;
            const xs = ps.map(p => p.x), ys = ps.map(p => p.y);
            const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
            const m = 34, k = Math.min((G.W - 2 * m) / Math.max(x1 - x0, 1),
                                       (G.H - 2 * m) / Math.max(y1 - y0, 1), 1.6);
            Object.keys(pos).forEach(id => {
                pos[id] = {
                    x: G.W / 2 + (pos[id].x - (x0 + x1) / 2) * k,
                    y: G.H / 2 + (pos[id].y - (y0 + y1) / 2) * k,
                };
            });
            return pos;
        }

        async function desenharGrafo(caminho) {
            const box = document.getElementById('av-grafo');
            if (!caminho) { box.innerHTML = '<div class="av-vazio">Abra uma nota primeiro.</div>'; return; }
            box.innerHTML = '<div class="av-vazio">Montando o grafo…</div>';
            let d;
            try {
                const p = new URLSearchParams({ caminho, saltos: 2, max_nos: 40 });
                d = await apiGet('/api/vault/grafo?' + p.toString());
            } catch (err) {
                // NÃO caia no texto de "ainda montando" abaixo: um erro de rede ou de
                // acesso não é uma malha em construção, e confundir os dois manda o
                // dono esperar por algo que nunca vai chegar.
                box.innerHTML = '<div class="av-vazio">Não montei o grafo.<br>' + escapeHtml(motivoFalha(err)) + '</div>';
                return;
            }

            if (!d.malha_pronta) {
                // Distinto de "sem vizinhos": a malha vive em RAM e é remontada em
                // segundo plano no boot. Dizer "não tem vizinho" aqui seria mentira.
                box.innerHTML = '<div class="av-vazio">A malha de conceitos ainda está sendo montada. Tente daqui a pouco.</div>';
                return;
            }
            if (d.nos.length <= 1) {
                box.innerHTML = '<div class="av-vazio">Esta nota não tem vizinhos fortes na malha.'
                              + '<br><span style="opacity:.7">Só contam conceitos RAROS — compartilhar um conceito genérico não é evidência de vizinhança.</span></div>';
                return;
            }

            const pos = posicoesDoGrafo(d.nos, d.arestas);
            const pesoMax = Math.max(...d.arestas.map(a => a.peso), 1);
            const rotular = d.nos.length <= 16;      // acima disso os rótulos se atropelam
            const partes = [`<svg viewBox="0 0 ${G.W} ${G.H}" preserveAspectRatio="xMidYMid meet" role="img">`];
            d.arestas.forEach(a => {
                const p1 = pos[a.de], p2 = pos[a.para];
                if (!p1 || !p2) return;              // ponta cortada pelo teto de nós
                const op = (0.22 + 0.6 * (a.peso / pesoMax)).toFixed(2);
                partes.push(`<line class="aresta" x1="${p1.x.toFixed(1)}" y1="${p1.y.toFixed(1)}"`
                    + ` x2="${p2.x.toFixed(1)}" y2="${p2.y.toFixed(1)}" stroke-opacity="${op}"`
                    + ` stroke-width="${(0.5 + 1.6 * (a.peso / pesoMax)).toFixed(2)}">`
                    + `<title>${escapeHtml(a.conceito)}</title></line>`);
            });
            d.nos.forEach(n => {
                const p = pos[n.id], r = G.PONTO[Math.min(n.salto, 2)];
                const curto = n.nome.length > 18 ? n.nome.slice(0, 17) + '…' : n.nome;
                partes.push(`<g class="no${n.salto === 0 ? ' semente' : ''}" data-caminho="${escapeHtml(n.caminho)}">`
                    + `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r}" fill="${corDoSalto(n.salto)}"/>`
                    + ((rotular || n.salto === 0)
                        ? `<text x="${p.x.toFixed(1)}" y="${(p.y + r + 8).toFixed(1)}">${escapeHtml(curto)}</text>` : '')
                    + `<title>${escapeHtml(n.nome)}${n.familia ? ' · ' + escapeHtml(n.familia) : ''}</title></g>`);
            });
            partes.push('</svg>');

            // Contar SEM silêncio: um grafo que descarta metade dos vizinhos calado
            // se lê como "é só isso que existe".
            let legenda = d.truncado
                ? `${d.nos.length - 1} de ${d.alcancados} vizinhos em até 2 saltos`
                : `${d.nos.length - 1} vizinhos em até 2 saltos`;
            if (d.arestas_totais > d.arestas.length)
                legenda += ` · ${d.arestas.length} das ${d.arestas_totais} ligações`;
            partes.push(`<div class="legenda">${legenda} · clique num ponto para abrir</div>`);
            box.innerHTML = partes.join('');
            box.querySelectorAll('.no').forEach(g => {
                g.addEventListener('click', () => abrirNota(g.dataset.caminho));
            });
        }

        // --- aba 3: diagnóstico ---
        async function renderSistema() {
            const box = document.getElementById('av-sistema');
            box.innerHTML = '<div class="av-vazio">Lendo…</div>';
            try {
                const [m, h] = await Promise.all([
                    apiGet('/api/metrics'),
                    fetch('/api/health').then(r => r.json()),   // única /api sem gate, de propósito
                ]);
                const linha = (r, v) => `<div class="av-linha"><span>${escapeHtml(r)}</span><span>${escapeHtml(String(v))}</span></div>`;
                let html = '<div class="av-titulo">Serviços</div>';
                for (const [k, v] of Object.entries(h.servicos || {})) html += linha(k, v ? 'pronto' : 'não');
                if ((h.tarefas_de_fundo || []).length) html += linha('em segundo plano', h.tarefas_de_fundo.join(', '));
                const est = (m.waterfall || {}).estagios || {};
                html += '<div class="av-titulo">Latência por estágio (p50 / p95, ms)</div>';
                for (const [k, v] of Object.entries(est)) html += linha(k.replace(/_ms$/, ''), `${v.p50} / ${v.p95}   n=${v.n}`);
                html += '<div class="av-titulo">Base</div>';
                html += linha('conversas', m.total_conversas);
                html += linha('eventos de ETL', m.total_etl);
                for (const [k, v] of Object.entries(m.sessao || {})) html += linha(k, v);
                box.innerHTML = html;
            } catch (err) { box.innerHTML = '<div class="av-vazio">Falha ao ler as métricas.<br>' + escapeHtml(motivoFalha(err)) + '</div>'; }
        }

        // Início
        conversaId = novoId();
        conectarWS();
        ajustarAltura();
        lerEnergia();
        // O crachá de recados na abertura: sem isto, quem recebeu um recado com o app
        // fechado só descobriria abrindo o painel — e o pendente do scheduler já teria
        // sido entregue e concluído. `true` = silencioso: se o servidor recusar, a tela
        // não ganha um erro que ninguém pediu (a barra de acesso já cobre esse caso).
        carregarRecados(true);
        // A medida envelhece (o ETL do idle sobe e desce a VRAM sozinho), então a
        // faixa se atualiza sozinha. 20s é folgado: a rota só mede, não computa.
        setInterval(lerEnergia, 20000);
    </script>
</body>
</html>
