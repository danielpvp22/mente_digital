                    toast(partes.length ? 'Liberado: ' + partes.join(' e ') + '.' : 'Modelos soltos.');
                } else if (!desligar) { toast("Modelos de volta."); }
            } catch (err) {
                toast("Falha ao mudar o estado de energia.");
                pintarEnergia(desligar ? 'ligado' : 'descansando', '');
            } finally { energiaOcupada = false; }
        }

        async function lerEnergia() {
            try { const d = await energiaPost('estado'); pintarEnergia(d.estado, medidaDe(d)); }
            catch (err) { /* servidor fora do ar: o ponto de conexão já avisa */ }
        }

        // ---------- modo avançado ----------
        // Três abas: de onde veio a última resposta, o vault inteiro, e o estado
        // da máquina. Tudo lê rota que já existe; nada aqui recalcula nada.
        let ultimasFontes = null;   // null = ainda não houve resposta nesta sessão

        function alternarAvancado() {
            const el = document.getElementById('avancado');
            const abrindo = !el.classList.contains('active');
            el.classList.toggle('active', abrindo);
            document.getElementById('sw-avancado').classList.toggle('on', abrindo);
            if (abrindo) { fecharNota(); renderFontes(); }
        }

        function abrirAba(nome) {
            document.querySelectorAll('.av-tab').forEach(b => b.classList.toggle('on', b.dataset.aba === nome));
            document.querySelectorAll('.av-secao').forEach(s => s.classList.toggle('on', s.id === 'av-' + nome));
            fecharNota();
            if (nome === 'vault' && !document.getElementById('av-lista').children.length) buscarVault();
            if (nome === 'sistema') renderSistema();
        }

        // --- aba 1: fontes da última resposta ---
        // Os itens chegam no {tipo:"fontes"} que o servidor emite ao fim do
        // pipeline. Três formatos, um por origem: "memoria", "nota:<arquivo>",
        // "web:<dominio>". Só "nota:" é clicável — é a única que existe em disco.
        function renderFontes() {
            const box = document.getElementById('av-fontes');
            if (!ultimasFontes || !ultimasFontes.itens.length) {
                box.innerHTML = '<div class="av-vazio">Nenhuma resposta nesta sessão ainda.<br>Pergunte algo e volte aqui para ver de onde veio.</div>';
                return;
            }
            box.innerHTML = `<div class="av-titulo">Rota: ${escapeHtml(ultimasFontes.rota || '?')}</div>`;
            ultimasFontes.itens.forEach(item => {
                const div = document.createElement('div');
                div.className = 'av-item';
                if (item.startsWith('nota:')) {
                    const caminho = item.slice(5);
                    div.innerHTML = `<div class="t"><span class="av-tag">vault</span>${escapeHtml(caminho.split('/').pop())}</div>`
                                  + `<div class="s">${escapeHtml(caminho)}</div>`;
                    div.onclick = () => abrirNota(caminho);
                } else if (item.startsWith('web:')) {
                    const d = item.slice(4) || '(sem domínio)';
                    div.innerHTML = `<div class="t"><span class="av-tag">web</span>${escapeHtml(d)}</div>`;
                    div.style.cursor = 'default';
                } else {
                    div.innerHTML = `<div class="t"><span class="av-tag">memória</span>Contexto desta conversa</div>`;
                    div.style.cursor = 'default';
                }
                box.appendChild(div);
            });
        }

        // --- aba 2: navegador do vault ---
        let buscaTimer = null;
        let facetasCarregadas = false;
        document.getElementById('av-busca').addEventListener('input', () => {
            clearTimeout(buscaTimer); buscaTimer = setTimeout(buscarVault, 350);
        });
        // Os filtros NÃO usam debounce: um <select> muda por escolha deliberada,
        // não por digitação, e esperar 350 ms depois do clique parece travamento.
        ['av-f-pasta', 'av-f-origem', 'av-f-dias'].forEach(id => {
            document.getElementById(id).addEventListener('change', buscarVault);
        });
        document.getElementById('av-f-limpar').addEventListener('click', () => {
            document.getElementById('av-f-pasta').value = '';
            document.getElementById('av-f-origem').value = '';
            document.getElementById('av-f-dias').value = '0';
            buscarVault();
        });

        function filtrosVault() {
            return {
                pasta: document.getElementById('av-f-pasta').value,
                origem: document.getElementById('av-f-origem').value,
                dias: document.getElementById('av-f-dias').value,
            };
        }

        async function carregarFacetas() {
            // Uma vez por sessão: a varredura custa ~1,6 s no vault do dono
            // (24.838 notas) e o servidor já a cacheia por 2 min. Falhar aqui
            // deixa os filtros vazios e a busca segue funcionando sem eles.
            if (facetasCarregadas) return;
            try {
                const d = await apiGet('/api/vault/facetas');
                const opt = (v, t) => `<option value="${escapeHtml(v)}">${escapeHtml(t)}</option>`;
                document.getElementById('av-f-pasta').innerHTML =
                    opt('', 'Todas as pastas') + d.pastas.map(p => opt(p.valor, `${p.valor} (${p.n})`)).join('');
                document.getElementById('av-f-origem').innerHTML =
                    opt('', 'Toda origem') + d.familias.map(f => opt(f.valor, `${f.rotulo} (${f.n})`)).join('');
                facetasCarregadas = true;
            } catch (err) { /* filtros ficam vazios; a busca continua */ }
        }

        async function buscarVault() {
            carregarFacetas();
            const q = document.getElementById('av-busca').value.trim();
            const f = filtrosVault();
            const ativo = !!(f.pasta || f.origem || f.dias !== '0');
            document.getElementById('av-f-limpar').hidden = !ativo;
            const lista = document.getElementById('av-lista');
            lista.innerHTML = '<div class="av-vazio">Buscando…</div>';
            try {
                const p = new URLSearchParams({ k: 30, q, pasta: f.pasta, origem: f.origem, dias: f.dias });
                const d = await apiGet('/api/notas?' + p.toString());
                lista.innerHTML = '';
                if (!d.itens.length) {
                    // Distingue "não existe" de "seus filtros cortaram" — sem isso o
                    // usuário conclui que a busca quebrou e não que ele mesmo filtrou.
                    lista.innerHTML = ativo
                        ? '<div class="av-vazio">Nada com estes filtros. Tente limpar um deles.</div>'
                        : '<div class="av-vazio">Nada encontrado.</div>';
                    return;
                }
                const cab = document.createElement('div');
                cab.className = 'av-titulo';
                // Diz QUAL busca rodou: a semântica é a mesma que o assistente usa,
                // então esta tela também serve para depurar o RAG, não só navegar.
                let texto = d.modo === 'semantica'
                    ? 'Busca semântica — a mesma do assistente' : 'Notas modificadas mais recentemente';
                if (d.total_filtrado != null && d.total_filtrado > d.itens.length)
                    texto += ` — ${d.itens.length} de ${d.total_filtrado}`;
                cab.textContent = texto;
                lista.appendChild(cab);
                d.itens.forEach(it => {
                    const div = document.createElement('div');
                    div.className = 'av-item';
                    const dist = it.dist != null ? `<span class="av-tag">${it.dist}</span>` : '';
                    // A origem e a data COLHIDA viram etiqueta: é o que responde
                    // "de onde veio isto?" sem precisar abrir a nota.
                    const fam = it.familia ? `<span class="av-tag">${escapeHtml(it.familia)}</span>` : '';
                    const dt = it.colhido_em ? `<span class="av-tag">${escapeHtml(it.colhido_em)}</span>` : '';
                    div.innerHTML = `<div class="t">${dist}${fam}${dt}${escapeHtml(it.nome)}</div>`
                                  + (it.trecho ? `<div class="s">${escapeHtml(it.trecho)}…</div>` : '');
                    div.onclick = () => abrirNota(it.caminho);
                    lista.appendChild(div);
                });
            } catch (err) { lista.innerHTML = '<div class="av-vazio">Falha ao buscar.<br>' + escapeHtml(motivoFalha(err)) + '</div>'; }
        }

        let notaAberta = null;

        async function abrirNota(caminho) {
            const leitor = document.getElementById('av-leitor');
            notaAberta = caminho;
            mostrarGrafo(false);          // trocar de nota sempre volta ao texto
            document.getElementById('av-leitor-nome').textContent = caminho.split('/').pop();
            document.getElementById('av-leitor-corpo').innerHTML = '<div class="av-vazio">Abrindo…</div>';
            leitor.classList.add('on');
            try {
                const d = await apiGet('/api/nota?caminho=' + encodeURIComponent(caminho));
                // Mesmo parseMarkdown do chat: os wikilinks de figura viram <img> e o
                // escape contra HTML injetado da nota é o mesmo. Um renderizador só.
                document.getElementById('av-leitor-corpo').innerHTML = parseMarkdown(d.texto);
            } catch (err) {
                document.getElementById('av-leitor-corpo').innerHTML =
                    '<div class="av-vazio">Não consegui abrir esta nota.<br>' + escapeHtml(motivoFalha(err)) + '</div>';
            }
        }
        function fecharNota() {
            document.getElementById('av-leitor').classList.remove('on');
            mostrarGrafo(false);
            notaAberta = null;
        }

        // ---------------------- grafo da vizinhança ----------------------
        // SVG desenhado aqui, sem biblioteca. As duas páginas do graphify puxam
        // `vis-network` do unpkg.com: servi-las quebraria o pilar "100% local" e,
        // offline, elas nem renderizam. Para 1-2 saltos (dezenas de nós) um layout
        // radial resolve — e é determinístico, ao contrário de um force layout,
        // que redesenha diferente a cada abertura e impede reconhecer a forma.
        const G = { W: 400, H: 400, RAIO: [0, 118, 178], PONTO: [9, 6, 4.5] };

        function mostrarGrafo(ligado) {
            document.getElementById('av-grafo').hidden = !ligado;
            document.getElementById('av-leitor-corpo').style.display = ligado ? 'none' : '';
            document.getElementById('av-btn-grafo').classList.toggle('on', ligado);
        }

        function alternarGrafo() {
            const alvo = document.getElementById('av-grafo').hidden;
            mostrarGrafo(alvo);
            if (alvo) desenharGrafo(notaAberta);
        }

        function corDoSalto(s) { return s === 0 ? 'var(--acc3)' : s === 1 ? 'var(--acc2)' : 'var(--acc1)'; }

        function posicoesDoGrafo(nos, arestas) {
            // Radial, mas por PARENTESCO: a semente no centro, o 1º salto num anel
            // em volta dela, e cada nó de 2º salto num leque em volta do SEU PAI.
            //
            // Um anel global para o 2º salto (a primeira versão) desenhava um grafo
            // que MENTIA: com uma semente de um vizinho só, os 38 netos ficavam num
            // círculo centrado na semente e todas as linhas convergiam no filho —
            // que passava a parecer o centro do assunto, enquanto a nota aberta
            // parecia periférica. Visto no navegador em 2026-08-02.
            const porSalto = {};
            nos.forEach(n => (porSalto[n.salto] = porSalto[n.salto] || []).push(n));
            const pos = {};
            (porSalto[0] || []).forEach(n => (pos[n.id] = { x: 0, y: 0 }));

            const anel1 = porSalto[1] || [];
            anel1.forEach((n, i) => {
                const a = (i / anel1.length) * 2 * Math.PI - Math.PI / 2;
                pos[n.id] = { x: G.RAIO[1] * Math.cos(a), y: G.RAIO[1] * Math.sin(a) };
            });

            // Pai de cada neto: a primeira aresta que o liga a alguém já posicionado.
            const filhos = {};
            (porSalto[2] || []).forEach(n => {
                const liga = arestas.find(a => (a.de === n.id && pos[a.para]) || (a.para === n.id && pos[a.de]));
                const pai = liga ? (liga.de === n.id ? liga.para : liga.de) : null;
                (filhos[pai] = filhos[pai] || []).push(n);
            });
            Object.keys(filhos).forEach(pai => {
                const base = pos[pai] || { x: 0, y: 0 };
                // O leque aponta para FORA (do centro para o pai): é o que impede os
                // netos de cair por cima do miolo do desenho.
                const fora = Math.atan2(base.y, base.x) || -Math.PI / 2;
                const grupo = filhos[pai], n = grupo.length;
                // Um pai com muitos filhos precisa da volta inteira; com poucos, um
                // leque estreito lê melhor do que um círculo quase vazio.
                const abertura = Math.min(2 * Math.PI, 0.55 * n + 0.9);
                const r = G.RAIO[2] * (n > 12 ? 1 : 0.72);
                grupo.forEach((f, i) => {
                    const a = fora - abertura / 2 + (n === 1 ? abertura / 2 : (i / (n - 1)) * abertura);
                    pos[f.id] = { x: base.x + r * Math.cos(a), y: base.y + r * Math.sin(a) };
                });
            });

            // ENQUADRAMENTO: o leque pode sair do quadro. Em vez de chutar raios que
            // caibam sempre, mede-se o que foi desenhado e encaixa-se na viewBox.
            const ps = Object.values(pos);
            if (!ps.length) return pos;
            const xs = ps.map(p => p.x), ys = ps.map(p => p.y);
            const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
            const m = 34, k = Math.min((G.W - 2 * m) / Math.max(x1 - x0, 1),
                                       (G.H - 2 * m) / Math.max(y1 - y0, 1), 1.6);
            Object.keys(pos).forEach(id => {
                pos[id] = {
                    x: G.W / 2 + (pos[id].x - (x0 + x1) / 2) * k,
                    y: G.H / 2 + (pos[id].y - (y0 + y1) / 2) * k,
                };
            });
            return pos;
        }

        async function desenharGrafo(caminho) {
            const box = document.getElementById('av-grafo');
            if (!caminho) { box.innerHTML = '<div class="av-vazio">Abra uma nota primeiro.</div>'; return; }
            box.innerHTML = '<div class="av-vazio">Montando o grafo…</div>';
            let d;
            try {
                const p = new URLSearchParams({ caminho, saltos: 2, max_nos: 40 });
                d = await apiGet('/api/vault/grafo?' + p.toString());
            } catch (err) {
                // NÃO caia no texto de "ainda montando" abaixo: um erro de rede ou de
                // acesso não é uma malha em construção, e confundir os dois manda o
                // dono esperar por algo que nunca vai chegar.
                box.innerHTML = '<div class="av-vazio">Não montei o grafo.<br>' + escapeHtml(motivoFalha(err)) + '</div>';
                return;
            }

            if (!d.malha_pronta) {
                // Distinto de "sem vizinhos": a malha vive em RAM e é remontada em
                // segundo plano no boot. Dizer "não tem vizinho" aqui seria mentira.
                box.innerHTML = '<div class="av-vazio">A malha de conceitos ainda está sendo montada. Tente daqui a pouco.</div>';
                return;
            }
            if (d.nos.length <= 1) {
                box.innerHTML = '<div class="av-vazio">Esta nota não tem vizinhos fortes na malha.'
                              + '<br><span style="opacity:.7">Só contam conceitos RAROS — compartilhar um conceito genérico não é evidência de vizinhança.</span></div>';
                return;
            }

            const pos = posicoesDoGrafo(d.nos, d.arestas);
            const pesoMax = Math.max(...d.arestas.map(a => a.peso), 1);
            const rotular = d.nos.length <= 16;      // acima disso os rótulos se atropelam
            const partes = [`<svg viewBox="0 0 ${G.W} ${G.H}" preserveAspectRatio="xMidYMid meet" role="img">`];
            d.arestas.forEach(a => {
                const p1 = pos[a.de], p2 = pos[a.para];
                if (!p1 || !p2) return;              // ponta cortada pelo teto de nós
                const op = (0.22 + 0.6 * (a.peso / pesoMax)).toFixed(2);
                partes.push(`<line class="aresta" x1="${p1.x.toFixed(1)}" y1="${p1.y.toFixed(1)}"`
                    + ` x2="${p2.x.toFixed(1)}" y2="${p2.y.toFixed(1)}" stroke-opacity="${op}"`
                    + ` stroke-width="${(0.5 + 1.6 * (a.peso / pesoMax)).toFixed(2)}">`
                    + `<title>${escapeHtml(a.conceito)}</title></line>`);
            });
            d.nos.forEach(n => {
                const p = pos[n.id], r = G.PONTO[Math.min(n.salto, 2)];
                const curto = n.nome.length > 18 ? n.nome.slice(0, 17) + '…' : n.nome;
                partes.push(`<g class="no${n.salto === 0 ? ' semente' : ''}" data-caminho="${escapeHtml(n.caminho)}">`
                    + `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r}" fill="${corDoSalto(n.salto)}"/>`
                    + ((rotular || n.salto === 0)
                        ? `<text x="${p.x.toFixed(1)}" y="${(p.y + r + 8).toFixed(1)}">${escapeHtml(curto)}</text>` : '')
                    + `<title>${escapeHtml(n.nome)}${n.familia ? ' · ' + escapeHtml(n.familia) : ''}</title></g>`);
            });
            partes.push('</svg>');

            // Contar SEM silêncio: um grafo que descarta metade dos vizinhos calado
            // se lê como "é só isso que existe".
            let legenda = d.truncado
                ? `${d.nos.length - 1} de ${d.alcancados} vizinhos em até 2 saltos`
                : `${d.nos.length - 1} vizinhos em até 2 saltos`;
            if (d.arestas_totais > d.arestas.length)
                legenda += ` · ${d.arestas.length} das ${d.arestas_totais} ligações`;
            partes.push(`<div class="legenda">${legenda} · clique num ponto para abrir</div>`);
            box.innerHTML = partes.join('');
            box.querySelectorAll('.no').forEach(g => {
                g.addEventListener('click', () => abrirNota(g.dataset.caminho));
            });
        }

        // --- aba 3: diagnóstico ---
        async function renderSistema() {
            const box = document.getElementById('av-sistema');
            box.innerHTML = '<div class="av-vazio">Lendo…</div>';
            try {
                const [m, h] = await Promise.all([
                    apiGet('/api/metrics'),
                    fetch('/api/health').then(r => r.json()),   // única /api sem gate, de propósito
                ]);
                const linha = (r, v) => `<div class="av-linha"><span>${escapeHtml(r)}</span><span>${escapeHtml(String(v))}</span></div>`;
                let html = '<div class="av-titulo">Serviços</div>';
                for (const [k, v] of Object.entries(h.servicos || {})) html += linha(k, v ? 'pronto' : 'não');
                if ((h.tarefas_de_fundo || []).length) html += linha('em segundo plano', h.tarefas_de_fundo.join(', '));
                const est = (m.waterfall || {}).estagios || {};
                html += '<div class="av-titulo">Latência por estágio (p50 / p95, ms)</div>';
                for (const [k, v] of Object.entries(est)) html += linha(k.replace(/_ms$/, ''), `${v.p50} / ${v.p95}   n=${v.n}`);
                html += '<div class="av-titulo">Base</div>';
                html += linha('conversas', m.total_conversas);
                html += linha('eventos de ETL', m.total_etl);
                for (const [k, v] of Object.entries(m.sessao || {})) html += linha(k, v);
                box.innerHTML = html;
            } catch (err) { box.innerHTML = '<div class="av-vazio">Falha ao ler as métricas.<br>' + escapeHtml(motivoFalha(err)) + '</div>'; }
        }

        // Início
        conversaId = novoId();
        conectarWS();
        ajustarAltura();
        lerEnergia();
        // A medida envelhece (o ETL do idle sobe e desce a VRAM sozinho), então a
        // faixa se atualiza sozinha. 20s é folgado: a rota só mede, não computa.
        setInterval(lerEnergia, 20000);
    </script>
</body>
</html>
